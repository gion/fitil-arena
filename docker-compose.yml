# Postgres local pentru dezvoltare și teste (D-063): `pnpm db:up`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitil
      POSTGRES_PASSWORD: fitil
      POSTGRES_DB: fitil
    ports:
      - '5432:5432'
    volumes:
      - fitil-db:/var/lib/postgresql/data
      - ./tools/db/init-test.sql:/docker-entrypoint-initdb.d/init-test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitil']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  fitil-db:
