# Producție pe un singur VPS (D-081): Postgres + server de joc + Caddy (web + TLS) + backup zilnic.
# Pornire: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: fuse-arena

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?lipsește POSTGRES_PASSWORD în deploy/.env}
      POSTGRES_DB: fitil
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitil']
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: { context: .., target: server }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fitil:${POSTGRES_PASSWORD}@db:5432/fitil
      TRUST_PROXY: '1'
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ..
      target: web
      args:
        VITE_SERVER_URL: wss://play.${DOMAIN:?lipsește DOMAIN în deploy/.env}
        VITE_API_URL: https://api.${DOMAIN}
        VITE_WEB_URL: https://${DOMAIN}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_STORE_IOS: ${VITE_STORE_IOS:-}
        VITE_STORE_ANDROID: ${VITE_STORE_ANDROID:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?lipsește ACME_EMAIL în deploy/.env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server: { condition: service_healthy }

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          f=/backups/fitil-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump -h db -U fitil fitil | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup: $$f"
          find /backups -name 'fitil-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      db: { condition: service_healthy }

volumes:
  db:
  caddy-data:
  caddy-config:
