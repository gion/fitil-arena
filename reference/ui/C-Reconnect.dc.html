<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Connection lost (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:ital,wght@0,500;0,700;0,800;1,500&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #679D48; background-image: linear-gradient(45deg, rgba(0,0,0,0.1) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.1) 75%), linear-gradient(45deg, rgba(0,0,0,0.1) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.1) 75%); background-size: 96px 96px; background-position: 0 0, 48px 48px; color: #111111; font-family: 'Rubik', sans-serif; display: flex; align-items: center; justify-content: center">
  <div style="position: absolute; inset: 0; background-color: rgba(17,17,17,0.74); background-image: radial-gradient(rgba(255,214,10,0.22) 24%, transparent 25%); background-size: 14px 14px"></div>

  <div style="position: relative; width: 600px; box-sizing: border-box; background: #FFFFFF; border: 4px solid #111111; box-shadow: 8px 8px 0 #E5262B; padding: 18px 20px 16px; display: flex; gap: 18px; transform: rotate(-1deg)">
    <div style="position: absolute; left: -14px; top: -18px; font-style: italic; font-weight: 500; font-size: 14px; background: #FFF3B0; border: 3px solid #111111; padding: 3px 12px; transform: rotate(-2deg)">Suddenly, somewhere in the tubes…</div>
    <div style="width: 160px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; background: #19B5E8; border: 3px solid #111111; position: relative; overflow: hidden">
      <div style="position: absolute; left: 8px; right: 8px; top: 8px; background: #FFFFFF; border: 3px solid #111111; border-radius: 18px 18px 18px 4px; padding: 5px 8px; font-weight: 800; font-size: 13px; text-align: center">Hello? Anyone?</div>
      <svg viewBox="0 -8 100 118" style="width: 120px; height: 142px" aria-hidden="true">
        <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
        <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
        <circle cx="72" cy="4" r="6" style="fill: #FFD23F; stroke: #12131C; stroke-width: 3"/>
        <circle cx="50" cy="58" r="38" style="fill: #FFD23F; stroke: #12131C; stroke-width: 5"/>
        <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
        <circle cx="36" cy="56" r="4" style="fill: #12131C"/><circle cx="64" cy="56" r="4" style="fill: #12131C"/>
        <path d="M26 44 l14 -5M74 44 l-14 -5" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
        <path d="M42 78 q8 -7 16 0" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
        <ellipse cx="82" cy="50" rx="4" ry="6" style="fill: #8FD3FF; stroke: #12131C; stroke-width: 2"/>
      </svg>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px">
      <h1 style="margin: 0; align-self: flex-start; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 40px; line-height: 1; letter-spacing: 3px; color: #FFD60A; background: #111111; padding: 4px 20px; transform: skewX(-8deg)">{{title}}</h1>
      <div style="font-weight: 500; font-size: 14px; line-height: 1.35">{{body}}</div>
      <sc-if value="{{isTrying}}" hint-placeholder-val="{{true}}">
        <div>
          <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; margin-bottom: 4px"><span>Reconnecting…</span><span>12s left</span></div>
          <div style="height: 22px; box-sizing: border-box; background: #FFFFFF; border: 3px solid #111111">
            <div style="width: 80%; height: 100%; background: repeating-linear-gradient(-45deg, #E5262B 0 10px, #111111 10px 14px)"></div>
          </div>
        </div>
      </sc-if>
      <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
        <button type="button" onClick="{{toggle}}" style="height: 54px; font-family: 'Bangers', sans-serif; font-size: 24px; letter-spacing: 1px; color: #FFFFFF; background: #E5262B; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; transform: skewX(-6deg); cursor: pointer">{{primary}}</button>
        <a href="C-Home.dc.html" style="height: 54px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 22px; letter-spacing: 1px; color: #111111; background: #FFFFFF; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; transform: skewX(-6deg)">LEAVE MATCH</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["reconnecting","failed"],"default":"reconnecting"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const base = this.props.state ?? 'reconnecting';
const flipped = !!(this.state && this.state.flipped);
const trying = (base === 'reconnecting') !== flipped;
return {
  isTrying: trying,
  title: trying ? 'CONNECTION LOST' : 'NO WAY BACK',
  body: trying
    ? 'The match keeps going without you. Your character stands still until you are back.'
    : 'We could not get you back in time. A bot took your seat for the rest of the match.',
  primary: trying ? 'TRY NOW' : 'TRY AGAIN',
  toggle: () => this.setState({ flipped: !flipped })
};
}
}
</script>
</body>
</html>
