<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Feedback and motion (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:ital,wght@0,500;0,700;0,800;1,500&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
@keyframes mz-spin{to{transform:rotate(360deg)}}
@keyframes mz-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes mz-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
@keyframes mz-wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@keyframes mz-pulse{0%,80%,100%{transform:rotate(8deg) scale(1)}90%{transform:rotate(8deg) scale(1.18)}}
@keyframes mz-thump{0%{transform:scale(1.5) rotate(-12deg)}60%{transform:scale(0.92) rotate(-3deg)}100%{transform:scale(1) rotate(-4deg)}}
@keyframes mz-shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes mz-pop{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.2) rotate(10deg)}100%{transform:scale(1) rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #FFD60A; background-image: radial-gradient(#F2B600 24%, transparent 25%); background-size: 14px 14px; color: #111111; font-family: 'Rubik', sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 14px 56px 18px">
  <div style="display: flex; align-items: center; gap: 14px">
    <h1 style="margin: 0; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; color: #FFD60A; background: #111111; padding: 2px 18px; transform: skewX(-8deg)">FEEL LAB</h1>
    <div style="font-style: italic; font-weight: 500; font-size: 14px; background: #FFF3B0; border: 3px solid #111111; padding: 4px 12px">Press things. Watch the character and the readout.</div>
  </div>

  <div style="flex-grow: 1; display: flex; gap: 18px; min-height: 0">
    <div style="position: relative; width: 220px; flex-shrink: 0; overflow: hidden; background: #19B5E8; border: 4px solid #111111; box-shadow: 6px 6px 0 #111111; transform: rotate(-1.500deg); display: flex; align-items: flex-end; justify-content: center">
      <div style="position: absolute; left: -290px; top: -260px; width: 800px; height: 800px; border-radius: 50%; background: repeating-conic-gradient(#5CCBF0 0deg 9deg, #19B5E8 9deg 18deg); animation: mz-spin 90s linear infinite"></div>
      <div style="position: absolute; left: 10px; right: 10px; top: 10px; background: #FFFFFF; border: 3px solid #111111; border-radius: 22px 22px 22px 6px; padding: 6px 10px; font-weight: 800; font-size: 14px; line-height: 1.2; text-align: center">{{say}}</div>
      <div style="position: relative; animation: mz-bob 1.600s ease-in-out infinite">
        <svg viewBox="0 -8 100 118" style="display: block; width: 150px; height: 177px" aria-hidden="true">
          <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
          <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
          <circle cx="72" cy="4" r="6" style="fill: #5AD15A; stroke: #12131C; stroke-width: 3"/>
          <circle cx="50" cy="58" r="38" style="fill: #5AD15A; stroke: #12131C; stroke-width: 5"/>
          <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
            <g style="transform-origin: 50px 53px; animation: mz-blink 4s infinite">
              <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
              <circle cx="38" cy="55" r="4" style="fill: #12131C"/><circle cx="66" cy="55" r="4" style="fill: #12131C"/>
            </g>
          </sc-if>
          <sc-if value="{{isHappy}}" hint-placeholder-val="{{false}}">
            <path d="M28 56 q8 -11 16 0M56 56 q8 -11 16 0" style="fill: none; stroke: #12131C; stroke-width: 4.500; stroke-linecap: round"/>
            <path d="M40 68 a10 10 0 0 0 20 0z" style="fill: #12131C"/>
            <path d="M45 74 a5 4 0 0 0 10 0z" style="fill: #FF6B8A"/>
          </sc-if>
          <sc-if value="{{isFierce}}" hint-placeholder-val="{{false}}">
            <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
            <circle cx="38" cy="55" r="4" style="fill: #12131C"/><circle cx="66" cy="55" r="4" style="fill: #12131C"/>
            <path d="M25 40 l16 5M75 40 l-16 5" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
            <path d="M42 74 h16" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
          </sc-if>
          <sc-if value="{{isSad}}" hint-placeholder-val="{{false}}">
            <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
            <circle cx="36" cy="57" r="4" style="fill: #12131C"/><circle cx="64" cy="57" r="4" style="fill: #12131C"/>
            <path d="M26 44 l14 -5M74 44 l-14 -5" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
            <path d="M42 78 q8 -7 16 0" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
            <ellipse cx="82" cy="50" rx="4" ry="6" style="fill: #8FD3FF; stroke: #12131C; stroke-width: 2"/>
          </sc-if>
        </svg>
      </div>
    </div>

    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
        <button type="button" onPointerDown="{{play.down}}" onPointerUp="{{play.up}}" onPointerLeave="{{play.leave}}" style="height: 72px; padding: 0; font-family: 'Bangers', sans-serif; font-size: 40px; letter-spacing: 2px; color: #FFFFFF; background: #E5262B; border: 4px solid #111111; box-shadow: {{play.shadow}}; transform: {{play.transform}}; transition: transform 0.080s ease-out, box-shadow 0.080s ease-out; cursor: pointer">PLAY!</button>
        <button type="button" onPointerDown="{{shop.down}}" onPointerUp="{{shop.up}}" onPointerLeave="{{shop.leave}}" style="height: 72px; padding: 0; font-family: 'Bangers', sans-serif; font-size: 26px; letter-spacing: 1px; color: #111111; background: #FFFFFF; border: 3px solid #111111; box-shadow: {{shop.shadow}}; transform: {{shop.transform}}; transition: transform 0.080s ease-out, box-shadow 0.080s ease-out; cursor: pointer">SHOP</button>
        <button type="button" onClick="{{buy}}" style="position: relative; height: 72px; padding: 0; font-family: 'Bangers', sans-serif; font-size: 22px; letter-spacing: 1px; color: #111111; background: #FFF3B0; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; cursor: pointer">BUY · 40 FITILE
          <sc-if value="{{bought}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; right: -10px; top: -14px; font-size: 18px; color: #FFFFFF; background: #E5262B; border: 3px solid #111111; padding: 0 8px; animation: mz-pop 0.260s ease-out both">YOURS!</span>
          </sc-if>
        </button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
        <button type="button" role="switch" aria-checked="{{soundOn}}" onClick="{{flip}}" style="height: 72px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; font-family: 'Bangers', sans-serif; font-size: 24px; letter-spacing: 1px; color: #111111; background: #FFFFFF; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; cursor: pointer">SOUND
          <sc-if value="{{soundOn}}" hint-placeholder-val="{{true}}">
            <span style="width: 56px; text-align: center; font-size: 26px; color: #111111; background: #5BE36A; border: 3px solid #111111; animation: mz-thump 0.180s ease-out both">ON</span>
          </sc-if>
          <sc-if value="{{soundOff}}" hint-placeholder-val="{{false}}">
            <span style="width: 56px; text-align: center; font-size: 26px; color: #B3151A; background: #FFFFFF; border: 3px solid #B3151A; animation: mz-thump 0.180s ease-out both">OFF</span>
          </sc-if>
        </button>
        <button type="button" onClick="{{locked}}" style="height: 72px; padding: 0; background: transparent; border: 0; cursor: pointer">
          <sc-if value="{{shaking}}" hint-placeholder-val="{{false}}">
            <span style="height: 72px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; font-family: 'Bangers', sans-serif; font-size: 22px; letter-spacing: 1px; color: #111111; background: #FFFFFF; border: 3px dashed #111111; animation: mz-shake 0.240s linear both">CROWN<span style="font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 12px; color: #B3151A">Player Lv 6</span></span>
          </sc-if>
          <sc-if value="{{still}}" hint-placeholder-val="{{true}}">
            <span style="height: 72px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; font-family: 'Bangers', sans-serif; font-size: 22px; letter-spacing: 1px; color: #111111; background: #FFFFFF; border: 3px dashed #111111; opacity: 0.6">CROWN<span style="font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 12px; color: #B3151A">Player Lv 6</span></span>
          </sc-if>
        </button>
        <div style="position: relative; height: 72px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 14px; border: 3px dashed #111111">
          <span style="font-family: 'Bangers', sans-serif; font-size: 54px; line-height: 1; color: #FFFFFF; -webkit-text-stroke: 6px #111111; paint-order: stroke fill; animation: mz-wobble 1.200s ease-in-out infinite">?</span>
          <span style="font-family: 'Bangers', sans-serif; font-size: 16px; letter-spacing: 1px; color: #FFFFFF; background: #E5262B; border: 3px solid #111111; padding: 0 6px; animation: mz-pulse 3s ease-in-out infinite">NEW!</span>
        </div>
      </div>
      <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; background: #111111; color: #FFFFFF; border: 3px solid #111111">
        <div style="padding: 6px 12px; border-right: 3px solid #FFD60A; line-height: 1.25"><div style="font-weight: 800; font-size: 11px; letter-spacing: 1px; color: #FFD60A">LAST ACTION</div><div style="font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px">{{log.action}}</div></div>
        <div style="padding: 6px 12px; border-right: 3px solid #FFD60A; line-height: 1.25"><div style="font-weight: 800; font-size: 11px; letter-spacing: 1px; color: #FFD60A">SOUND</div><div style="font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px">{{log.sound}}</div></div>
        <div style="padding: 6px 12px; line-height: 1.25"><div style="font-weight: 800; font-size: 11px; letter-spacing: 1px; color: #FFD60A">HAPTIC</div><div style="font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px">{{log.haptic}}</div></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const face = st.face || 'idle';
const react = (f, say, log, ms) => {
  clearTimeout(this._t);
  this.setState({ face: f, say, log });
  this._t = setTimeout(() => this.setState({ face: 'idle', say: null }), ms || 1100);
};
const press = (key, depth, rest, say, face, log) => {
  const down = st.down === key;
  return {
    shadow: down ? '0 0 0 #111111' : rest + 'px ' + rest + 'px 0 #111111',
    transform: down ? 'translate(' + depth + 'px,' + depth + 'px)' : 'translate(0,0)',
    down: () => this.setState({ down: key }),
    leave: () => { if (down) this.setState({ down: null }); },
    up: () => { this.setState({ down: null }); react(face, say, log); }
  };
};
const soundOn = st.sound !== false;
return {
  isIdle: face === 'idle', isHappy: face === 'happy', isFierce: face === 'fierce', isSad: face === 'sad',
  say: st.say || 'Go on, press something.',
  log: st.log || { action: 'Nothing yet', sound: '—', haptic: '—' },
  play: press('play', 6, 6, 'Let’s blow stuff up!', 'fierce', { action: 'Main button', sound: 'Pop, low', haptic: 'Light · 12 ms' }),
  shop: press('shop', 4, 4, 'Ooh, shopping.', 'happy', { action: 'Secondary button', sound: 'Tick', haptic: 'Light · 8 ms' }),
  bought: !!st.bought,
  buy: () => { this.setState({ bought: true }); react('happy', 'Mine! All mine!', { action: 'Purchase', sound: 'Tada', haptic: 'Medium · 30 ms' }, 1400); },
  soundOn, soundOff: !soundOn,
  flip: () => { this.setState({ sound: !soundOn }); react(soundOn ? 'sad' : 'happy', soundOn ? 'Fine. I’ll whisper.' : 'CAN YOU HEAR ME?', { action: soundOn ? 'Toggle off' : 'Toggle on', sound: soundOn ? 'Stamp, lower' : 'Stamp', haptic: 'Light · 15 ms' }); },
  shaking: !!st.shake, still: !st.shake,
  locked: () => { this.setState({ shake: true }); setTimeout(() => this.setState({ shake: false }), 260); react('sad', 'Not yet. Level 6.', { action: 'Locked item', sound: 'Nope buzz', haptic: '20 · 40 · 20 ms' }); }
};
}
}
</script>
</body>
</html>
