<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Mode select (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #FFD60A; background-image: radial-gradient(#F2B600 24%, transparent 25%); background-size: 14px 14px; color: #111111; font-family: 'Rubik', sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 14px 56px 20px">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="C-Home.dc.html" aria-label="Back" style="width: 46px; height: 46px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; color: #FFD60A; background: #111111; padding: 2px 18px; transform: skewX(-8deg)">PICK A MODE</h1>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="7">
      <button type="button" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="position: relative; height: 100px; padding: 0 0 0 10px; display: flex; align-items: center; gap: 10px; text-align: left; font-family: 'Rubik', sans-serif; color: #111111; background: {{m.bg}}; border: 4px solid #111111; box-shadow: {{m.shadow}}; cursor: pointer; transform: {{m.tilt}}">
        <span style="font-family: 'Bangers', sans-serif; font-size: 40px; line-height: 1; color: {{m.color}}; -webkit-text-stroke: 5px #111111; paint-order: stroke fill; min-width: 62px; text-align: center">{{m.big}}</span>
        <span style="display: flex; flex-direction: column; line-height: 1.15; padding-right: 6px">
          <span style="font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px">{{m.name}}</span>
          <span style="font-weight: 500; font-size: 12px">{{m.hint}}</span>
        </span>
        <sc-if value="{{m.on}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; right: -10px; top: -14px; font-family: 'Bangers', sans-serif; font-size: 18px; letter-spacing: 1px; color: #FFFFFF; background: #E5262B; border: 3px solid #111111; padding: 0 8px; transform: rotate(8deg)">PICKED!</span>
        </sc-if>
      </button>
    </sc-for>
    <div style="height: 100px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px; border: 4px dashed #111111">TO BE CONTINUED…</div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 18px">
    <div style="flex-grow: 1; min-width: 0; background: #FFF3B0; border: 3px solid #111111; padding: 8px 14px; font-weight: 500; font-size: 14px; line-height: 1.3"><span style="font-weight: 800">{{sel.name}}:</span> {{sel.desc}}</div>
    <a href="C-Home.dc.html" style="flex-shrink: 0; width: 190px; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 32px; letter-spacing: 2px; color: #FFFFFF; background: #E5262B; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; transform: skewX(-6deg)">THIS ONE!</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.mode) || 'classic';
const defs = [
  { id: 'classic', big: '4', name: 'Classic', hint: 'Free-for-all', color: '#FFD60A', desc: 'four players, one arena, last one standing takes the round.' },
  { id: 'duel', big: '1v1', name: '1 vs 1', hint: 'Small 11×11 arena', color: '#FF8FB6', desc: 'two players in opposite corners, both starting with the same 3 power-ups.' },
  { id: 'teams', big: '3v3', name: 'Teams', hint: 'Blues vs Reds', color: '#19B5E8', desc: 'friendly fire is off. The team with someone still standing wins.' },
  { id: 'flag', big: '3v3', name: 'Capture the flag', hint: 'First to 3 captures', color: '#5BE36A', desc: 'steal their flag and carry it home. You respawn after 3 seconds.' },
  { id: 'spin', big: '360', name: 'Spinning arena', hint: 'The map rotates', color: '#C79BFF', desc: 'the arena spins faster and faster, and flips direction every 25 seconds.' },
  { id: 'rows', big: '3–6', name: 'Sliding rows', hint: 'Rows shift around', color: '#FF8A3D', desc: 'rows and columns slide, crates and all. Do not get squashed.' },
  { id: 'missions', big: '1', name: 'Missions', hint: 'Solo, with stars', color: '#FFFFFF', desc: 'just you in the endless world, with a health bar and 1–3 stars.' }
];
const tilts = ['rotate(-1deg)', 'rotate(1deg)', 'rotate(-0.500deg)', 'rotate(1.500deg)', 'rotate(1deg)', 'rotate(-1.500deg)', 'rotate(0.500deg)'];
const modes = defs.map((m, i) => ({
  ...m,
  on: m.id === picked,
  bg: m.id === picked ? '#FFF3B0' : '#FFFFFF',
  shadow: m.id === picked ? '7px 7px 0 #E5262B' : '4px 4px 0 #111111',
  tilt: tilts[i],
  pick: () => this.setState({ mode: m.id })
}));
return { modes, sel: defs.find((m) => m.id === picked) };
}
}
</script>
</body>
</html>
