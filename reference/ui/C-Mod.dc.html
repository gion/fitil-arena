<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Choose a mode (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #FFD60A; background-image: radial-gradient(#F2B600 24%, transparent 25%); background-size: 14px 14px; color: #111111; font-family: 'Rubik', sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 14px 56px 20px">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="C-Home.dc.html" aria-label="Back" style="width: 46px; height: 46px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; color: #FFD60A; background: #111111; padding: 2px 18px; transform: skewX(-8deg)">CHOOSE A MODE</h1>
    <div style="margin-left: auto; min-width: 0; max-width: 430px; background: #FFF3B0; border: 3px solid #111111; padding: 4px 12px; font-weight: 500; font-size: 13px; line-height: 1.3"><span style="font-weight: 800">{{sel.name}}:</span> {{sel.desc}}</div>
  </div>

  <div style="flex-grow: 1; display: flex; gap: 18px; min-height: 0">
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-content: start; padding-top: 4px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="9">
        <button type="button" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="position: relative; height: 84px; padding: 0 10px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left; font-family: 'Rubik', sans-serif; color: #111111; background: {{m.bg}}; border: 4px solid #111111; box-shadow: {{m.shadow}}; cursor: pointer; transform: {{m.tilt}}; opacity: {{m.opacity}}">
          <span style="font-family: 'Bangers', sans-serif; font-size: 22px; line-height: 1.05; letter-spacing: 1px">{{m.name}}</span>
          <span style="font-weight: 700; font-size: 12px">{{m.sub}}</span>
          <sc-if value="{{m.on}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; right: -10px; top: -14px; font-family: 'Bangers', sans-serif; font-size: 18px; letter-spacing: 1px; color: #FFFFFF; background: #E5262B; border: 3px solid #111111; padding: 0 8px; transform: rotate(8deg)">PICKED!</span>
          </sc-if>
          <sc-if value="{{m.fresh}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; right: -8px; bottom: -10px; font-family: 'Bangers', sans-serif; font-size: 16px; letter-spacing: 1px; color: #111111; background: #5BE36A; border: 3px solid #111111; padding: 0 6px; transform: rotate(-6deg)">NEW</span>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <div style="width: 250px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px">
      <a href="C-Personaje.dc.html" style="display: flex; align-items: center; gap: 10px; height: 60px; box-sizing: border-box; padding: 0 10px; text-decoration: none; color: #111111; background: #19B5E8; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111">
        <span style="width: 38px; height: 38px; box-sizing: border-box; border-radius: 50%; background: #5AD15A; border: 4px solid #111111; flex-shrink: 0"></span>
        <span style="display: flex; flex-direction: column; line-height: 1.15">
          <span style="font-family: 'Bangers', sans-serif; font-size: 22px; letter-spacing: 1px">Bubu — Big Bang</span>
          <span style="font-weight: 700; font-size: 12px">change character</span>
        </span>
      </a>
      <div>
        <div style="font-weight: 800; font-size: 12px; letter-spacing: 1px; margin-bottom: 3px">RULES</div>
        <div role="group" aria-label="Rules" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 3px solid #111111; background: #FFFFFF">
          <sc-for list="{{rules}}" as="r" hint-placeholder-count="2">
            <button type="button" aria-pressed="{{r.on}}" onClick="{{r.pick}}" style="height: 44px; padding: 0; font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px; color: {{r.fg}}; background: {{r.bg}}; border: 0; cursor: pointer">{{r.label}}</button>
          </sc-for>
        </div>
      </div>
      <div>
        <div style="font-weight: 800; font-size: 12px; letter-spacing: 1px; margin-bottom: 3px">BOTS</div>
        <div role="group" aria-label="Bot difficulty" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 3px solid #111111; background: #FFFFFF">
          <sc-for list="{{bots}}" as="b" hint-placeholder-count="4">
            <button type="button" aria-pressed="{{b.on}}" onClick="{{b.pick}}" style="height: 44px; padding: 0; font-family: 'Bangers', sans-serif; font-size: 17px; letter-spacing: 0.500px; color: {{b.fg}}; background: {{b.bg}}; border: 0; cursor: pointer">{{b.label}}</button>
          </sc-for>
        </div>
      </div>
      <a href="C-RoundStart.dc.html" style="margin-top: auto; height: 62px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 36px; letter-spacing: 3px; color: #FFFFFF; background: #E5262B; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; transform: skewX(-6deg)">START!</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const picked = st.mode || 'ffa';
const defs = [
  { id: 'ffa', name: 'Free for all', sub: 'You against 3 bots', desc: 'Last one standing wins.' },
  { id: 'duel', name: '1 vs 1', sub: 'Small arena duel', desc: 'Both start with the same random power-ups.' },
  { id: 'team2', name: 'Teams 2v2', sub: 'You and a teammate', desc: 'Friendly bombs can’t hurt you.' },
  { id: 'team3', name: 'Teams 3v3', sub: '3 against 3', desc: 'Friendly bombs can’t hurt you.' },
  { id: 'ctf', name: 'Capture the flag', sub: 'First to 3 captures', desc: 'Steal the enemy flag and bring it home. You respawn after 3s.' },
  { id: 'spin', name: 'Spinning arena', sub: 'The map rotates', desc: 'The arena spins faster and faster and changes direction.', fresh: true },
  { id: 'rows', name: 'Shifting rows', sub: 'Rows slide around', desc: 'If a crate pushes you into a wall, you get squashed.' },
  { id: 'crown', name: 'Crown', sub: 'Player Lv 6', desc: 'Grab the crown and keep it.', locked: true },
  { id: 'potato', name: 'Hot potato', sub: 'Player Lv 8', desc: 'Don’t be the one holding it when it blows.', locked: true }
];
const tilts = ['rotate(-1deg)', 'rotate(1deg)', 'rotate(-0.500deg)', 'rotate(1deg)', 'rotate(-1deg)', 'rotate(0.500deg)', 'rotate(-0.500deg)', 'rotate(1deg)', 'rotate(-1deg)'];
const modes = defs.map((m, i) => ({
  ...m,
  on: m.id === picked,
  fresh: !!m.fresh && m.id !== picked,
  bg: m.id === picked ? '#FFF3B0' : '#FFFFFF',
  shadow: m.id === picked ? '6px 6px 0 #E5262B' : '4px 4px 0 #111111',
  opacity: m.locked ? 0.55 : 1,
  tilt: tilts[i],
  pick: () => { if (!m.locked) this.setState({ mode: m.id }); }
}));
const seg = (key, labels, def) => labels.map((label) => {
  const on = (st[key] || def) === label;
  return { label, on, bg: on ? '#111111' : '#FFFFFF', fg: on ? '#FFD60A' : '#111111', pick: () => this.setState({ [key]: label }) };
});
return { modes, sel: defs.find((m) => m.id === picked), rules: seg('rules', ['Classic', 'Characters'], 'Characters'), bots: seg('bots', ['Easy', 'Normal', 'Hard', 'Insane'], 'Normal') };
}
}
</script>
</body>
</html>
