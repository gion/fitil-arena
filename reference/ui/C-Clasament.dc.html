<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Rankings (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #FFD60A; background-image: radial-gradient(#F2B600 24%, transparent 25%); background-size: 14px 14px; color: #111111; font-family: 'Rubik', sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 14px 56px 20px">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="C-Home.dc.html" aria-label="Back" style="width: 46px; height: 46px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; color: #FFD60A; background: #111111; padding: 2px 18px; transform: skewX(-8deg)">RANKINGS</h1>
    <div role="group" aria-label="Ranking type" style="margin-left: auto; display: flex; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="height: 44px; padding: 0 16px; font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px; color: {{t.fg}}; background: {{t.bg}}; border: 0; cursor: pointer">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; gap: 20px; min-height: 0">
    <div style="position: relative; width: 210px; flex-shrink: 0; box-sizing: border-box; overflow: hidden; background: #19B5E8; border: 4px solid #111111; box-shadow: 6px 6px 0 #111111; transform: rotate(-1.500deg); display: flex; flex-direction: column; align-items: center">
      <div style="align-self: stretch; background: #111111; color: #FFFFFF; text-align: center; font-weight: 800; font-size: 12px; letter-spacing: 1px; padding: 3px 0">YOUR RANK</div>
      <div style="font-family: 'Bangers', sans-serif; font-size: 72px; line-height: 1; color: #FFD60A; -webkit-text-stroke: 7px #111111; paint-order: stroke fill; margin-top: 4px">{{me.rank}}</div>
      <svg viewBox="0 -8 100 118" style="width: 84px; height: 99px; margin-top: -4px" aria-hidden="true">
        <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
        <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
        <circle cx="72" cy="4" r="6" style="fill: #FFD23F; stroke: #12131C; stroke-width: 3"/>
        <circle cx="50" cy="58" r="38" style="fill: #FFD23F; stroke: #12131C; stroke-width: 5"/>
        <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
        <circle cx="38" cy="55" r="4" style="fill: #12131C"/><circle cx="66" cy="55" r="4" style="fill: #12131C"/>
      </svg>
      <div style="margin-top: auto; align-self: stretch; background: #FFFFFF; border-top: 4px solid #111111; padding: 5px 8px; text-align: center; font-size: 12px; line-height: 1.3"><span style="font-weight: 800">{{me.score}}</span><br>{{me.gap}}</div>
    </div>

    <ol style="flex-grow: 1; margin: 0; padding: 0 8px 8px 0; list-style: none; display: flex; flex-direction: column; gap: 9px; overflow-y: auto">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <li style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; height: 44px; box-sizing: border-box; padding: 0 14px 0 0; background: {{r.bg}}; border: 3px solid #111111; box-shadow: {{r.shadow}}">
          <span style="align-self: stretch; width: 46px; display: flex; align-items: center; justify-content: center; font-family: 'Bangers', sans-serif; font-size: 24px; color: #FFFFFF; background: {{r.rankBg}}; border-right: 3px solid #111111">{{r.rank}}</span>
          <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; background: {{r.color}}; border: 3px solid #111111"></span>
          <span style="font-family: 'Bangers', sans-serif; font-size: 21px; letter-spacing: 1px">{{r.name}}</span>
          <span style="margin-left: auto; font-family: 'Bangers', sans-serif; font-size: 21px; letter-spacing: 1px">{{r.score}}</span>
        </li>
      </sc-for>
    </ol>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const tab = (this.state && this.state.tab) || 'global';
const cols = ['#FF5F93', '#4FC3FF', '#7DFFB0', '#FF8A3D', '#FFFFFF', '#FFD23F', '#C79BFF'];
const sets = {
  global: { me: { rank: '128', score: '1,240 trophies', gap: '35 more to reach #127' }, list: [['1', 'BoomBoom_King', '9,812'], ['2', 'TantiVetaFan', '9,640'], ['3', 'Sparky', '9,105'], ['4', 'NoBrakes', '8,870'], ['5', 'Mamaliga', '8,866'], ['6', 'PuffPuff', '8,512'], ['7', 'Hot Potato', '8,430']] },
  friends: { me: { rank: '2', score: '1,240 trophies', gap: 'Mara is 170 ahead' }, list: [['1', 'Mara', '1,410'], ['2', 'Gion (you)', '1,240'], ['3', 'Vlad', '980'], ['4', 'Ioana', '715'], ['5', 'Tudor', '402']] },
  daily: { me: { rank: '41', score: '1:58 today', gap: 'the map changes at midnight' }, list: [['1', 'Sparky', '0:47'], ['2', 'PuffPuff', '0:52'], ['3', 'NoBrakes', '0:55'], ['4', 'Mamaliga', '1:01'], ['5', 'Mara', '1:03'], ['6', 'BoomBoom_King', '1:04']] }
};
const s = sets[tab];
const rows = s.list.map((r, i) => {
  const mine = r[1].indexOf('(you)') > -1;
  return { rank: r[0], name: r[1], score: r[2], color: cols[i % cols.length], bg: mine ? '#FFF3B0' : '#FFFFFF', shadow: mine ? '4px 4px 0 #E5262B' : 'none', rankBg: i < 3 ? '#E5262B' : '#111111' };
});
const tabs = [['global', 'GLOBAL'], ['friends', 'FRIENDS'], ['daily', 'DAILY CHALLENGE']].map((t) => ({
  label: t[1],
  on: t[0] === tab,
  bg: t[0] === tab ? '#111111' : '#FFFFFF',
  fg: t[0] === tab ? '#FFD60A' : '#111111',
  pick: () => this.setState({ tab: t[0] })
}));
return { tabs, rows, me: s.me };
}
}
</script>
</body>
</html>
