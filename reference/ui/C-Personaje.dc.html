<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Characters (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #FFD60A; background-image: radial-gradient(#F2B600 24%, transparent 25%); background-size: 14px 14px; color: #111111; font-family: 'Rubik', sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 14px 56px 20px">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="C-Home.dc.html" aria-label="Back" style="width: 46px; height: 46px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; color: #FFD60A; background: #111111; padding: 2px 18px; transform: skewX(-8deg)">THE CAST</h1>
    <div style="margin-left: auto; background: #FFFFFF; border: 3px solid #111111; padding: 4px 12px; font-weight: 800; font-size: 13px">4 of 7 unlocked</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{roster}}" as="c" hint-placeholder-count="7">
      <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.selected}}" aria-label="{{c.name}}" style="position: relative; height: 112px; padding: 4px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow: visible; font-family: 'Bangers', sans-serif; font-size: 17px; letter-spacing: 1px; color: #111111; background: {{c.bg}}; border: 4px solid #111111; box-shadow: {{c.shadow}}; cursor: pointer; transform: {{c.tilt}}">
        <svg viewBox="0 -8 100 118" style="width: 62px; height: 73px; opacity: {{c.opacity}}" aria-hidden="true">
          <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
          <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 5; stroke-linecap: round"/>
          <circle cx="72" cy="4" r="6" fill="{{c.color}}" style="stroke: #12131C; stroke-width: 4"/>
          <circle cx="50" cy="58" r="38" fill="{{c.color}}" style="stroke: #12131C; stroke-width: 6"/>
          <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
          <circle cx="38" cy="55" r="4" style="fill: #12131C"/><circle cx="66" cy="55" r="4" style="fill: #12131C"/>
        </svg>
        <span style="width: 100%; box-sizing: border-box; background: #111111; color: #FFFFFF; white-space: nowrap; line-height: 1.4">{{c.short}}</span>
        <sc-if value="{{c.locked}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; left: 50%; top: 30px; transform: translateX(-50%) rotate(-12deg); font-family: 'Bangers', sans-serif; font-size: 15px; letter-spacing: 1px; color: #B3151A; background: #FFFFFF; border: 3px solid #B3151A; padding: 0 6px; white-space: nowrap">LOCKED</span>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: stretch; gap: 16px; min-height: 0">
    <div style="position: relative; width: 132px; flex-shrink: 0; overflow: hidden; background: #19B5E8; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; display: flex; align-items: flex-end; justify-content: center">
      <svg viewBox="0 -8 100 118" style="width: 108px; height: 127px" aria-hidden="true">
        <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
        <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
        <circle cx="72" cy="4" r="6" fill="{{sel.color}}" style="stroke: #12131C; stroke-width: 3"/>
        <circle cx="50" cy="58" r="38" fill="{{sel.color}}" style="stroke: #12131C; stroke-width: 5"/>
        <path d="M28 56 q8 -11 16 0M56 56 q8 -11 16 0" style="fill: none; stroke: #12131C; stroke-width: 4.500; stroke-linecap: round"/>
        <path d="M40 68 a10 10 0 0 0 20 0z" style="fill: #12131C"/>
      </svg>
    </div>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="font-family: 'Bangers', sans-serif; font-size: 34px; line-height: 1; letter-spacing: 1px">{{sel.name}}</span>
        <span style="font-weight: 800; font-size: 12px; letter-spacing: 1px; border: 3px solid #111111; padding: 1px 8px; background: {{sel.rarityColor}}">{{sel.rarityUpper}}</span>
      </div>
      <div style="align-self: flex-start; background: #FFFFFF; border: 3px solid #111111; border-radius: 20px 20px 20px 4px; padding: 6px 14px; font-weight: 700; font-size: 14px">“{{sel.quote}}”</div>
      <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="background: #FFF3B0; border: 3px solid #111111; padding: 4px 10px; font-size: 13px; line-height: 1.3"><span style="font-weight: 800">PASSIVE:</span> {{sel.passive}}</div>
        <div style="background: #FFF3B0; border: 3px solid #111111; padding: 4px 10px; font-size: 13px; line-height: 1.3"><span style="font-weight: 800">SUPER:</span> {{sel.super}}</div>
      </div>
    </div>
    <button type="button" style="align-self: flex-end; flex-shrink: 0; width: 170px; height: 64px; font-family: 'Bangers', sans-serif; font-size: 26px; letter-spacing: 2px; color: {{sel.ctaFg}}; background: {{sel.ctaBg}}; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; transform: skewX(-6deg); cursor: pointer">{{sel.cta}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const rar = { Common: '#FFFFFF', Rare: '#19B5E8', Epic: '#C79BFF', Legendary: '#FFD60A' };
const data = [
  { id: 'bubu', name: 'Bubu', short: 'Bubu', rarity: 'Common', color: '#FFD23F', quote: 'Small guy. Big boom.', passive: 'none. Just attitude.', super: 'big bomb, range +2, once', locked: false },
  { id: 'zuzu', name: 'Zuzu', short: 'Zuzu', rarity: 'Rare', color: '#7DFFB0', quote: 'Brakes are optional.', passive: 'starting speed +1', super: 'dash 3 tiles', locked: false },
  { id: 'gogu', name: 'Gogu', short: 'Gogu', rarity: 'Rare', color: '#4FC3FF', quote: 'Who left this bomb here? Me.', passive: 'starts with Kick', super: 'sticky bomb', locked: false },
  { id: 'fifi', name: 'Fifi', short: 'Fifi', rarity: 'Epic', color: '#FF5F93', quote: 'Who wants fireworks?', passive: 'kicked bombs bounce', super: 'cluster of 4 mini-bombs', locked: false },
  { id: 'veta', name: 'Tanti Veta', short: 'T. Veta', rarity: 'Epic', color: '#C79BFF', quote: 'I have something for you in my purse.', passive: 'shield, one hit per match', super: 'the purse: lobs a bomb across the screen', locked: true },
  { id: 'maestru', name: 'Maestrul Fitil', short: 'Maestrul', rarity: 'Legendary', color: '#FF8A3D', quote: 'Tick. Tock. I hear everything.', passive: 'sees bomb timers', super: 'freezes his bombs for 1.5s', locked: true },
  { id: 'robo', name: 'Robo-Mici', short: 'Robo', rarity: 'Legendary', color: '#FFFFFF', quote: 'Beep. Boop. Boom.', passive: 'leaves a trap when knocked out', super: 'teleports to any portal', locked: true }
];
const tilts = ['rotate(-3deg)', 'rotate(2deg)', 'rotate(-1deg)', 'rotate(3deg)', 'rotate(-2deg)', 'rotate(1deg)', 'rotate(-3deg)'];
const picked = (this.state && this.state.picked) || 'bubu';
const roster = data.map((c, i) => ({
  ...c,
  selected: c.id === picked,
  bg: c.id === picked ? '#FFFFFF' : '#FFF3B0',
  shadow: c.id === picked ? '6px 6px 0 #E5262B' : '4px 4px 0 #111111',
  tilt: c.id === picked ? 'rotate(0deg) translateY(-4px)' : tilts[i],
  opacity: c.locked ? 0.4 : 1,
  pick: () => this.setState({ picked: c.id })
}));
const s = data.find((c) => c.id === picked);
const sel = {
  ...s,
  rarityColor: rar[s.rarity],
  rarityUpper: s.rarity.toUpperCase(),
  cta: s.locked ? 'HOW TO GET?' : 'PICK ME!',
  ctaBg: s.locked ? '#FFFFFF' : '#E5262B',
  ctaFg: s.locked ? '#111111' : '#FFFFFF'
};
return { roster, sel };
}
}
</script>
</body>
</html>
