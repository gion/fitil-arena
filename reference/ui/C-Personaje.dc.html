<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Characters (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #FFD60A; background-image: radial-gradient(#F2B600 24%, transparent 25%); background-size: 14px 14px; color: #111111; font-family: 'Rubik', sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 14px 56px 18px">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="C-Home.dc.html" aria-label="Back" style="width: 46px; height: 46px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; color: #FFD60A; background: #111111; padding: 2px 18px; transform: skewX(-8deg)">THE CAST</h1>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; background: #FFFFFF; border: 3px solid #111111; font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px">
      <span style="width: 20px; height: 20px; border-radius: 50%; background: #FFD60A; border: 3px solid #111111; box-sizing: border-box"></span>850 <span style="font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 0">Fitile</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{roster}}" as="c" hint-placeholder-count="11">
      <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.selected}}" aria-label="{{c.name}}" style="position: relative; height: 88px; padding: 0; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; font-family: 'Rubik', sans-serif; color: #111111; background: {{c.bg}}; border: 4px solid #111111; border-top: 8px solid {{c.rarityColor}}; box-shadow: {{c.shadow}}; cursor: pointer; transform: {{c.tilt}}">
        <svg viewBox="0 -8 100 118" style="align-self: center; width: 40px; height: 47px; opacity: {{c.opacity}}" aria-hidden="true">
          <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
          <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 5; stroke-linecap: round"/>
          <circle cx="72" cy="4" r="6" fill="{{c.color}}" style="stroke: #12131C; stroke-width: 4"/>
          <circle cx="50" cy="58" r="38" fill="{{c.color}}" style="stroke: #12131C; stroke-width: 6"/>
          <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
          <circle cx="38" cy="55" r="4" style="fill: #12131C"/><circle cx="66" cy="55" r="4" style="fill: #12131C"/>
        </svg>
        <span style="background: #111111; color: #FFFFFF; text-align: center; line-height: 1.1; padding: 2px 0">
          <span style="display: block; font-family: 'Bangers', sans-serif; font-size: 16px; letter-spacing: 0.500px; white-space: nowrap">{{c.short}}</span>
          <span style="display: block; font-weight: 700; font-size: 10.500px; color: {{c.stateColor}}; white-space: nowrap">{{c.state}}</span>
        </span>
      </button>
    </sc-for>
    <div style="height: 88px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'Bangers', sans-serif; font-size: 16px; letter-spacing: 1px; border: 4px dashed #111111">MORE SOON…</div>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: stretch; gap: 14px; min-height: 0">
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; background: #FFFFFF; border: 3px solid #111111; padding: 6px 12px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="font-family: 'Bangers', sans-serif; font-size: 28px; line-height: 1; letter-spacing: 1px">{{sel.name}}</span>
        <span style="font-weight: 800; font-size: 11px; letter-spacing: 1px; color: #111111; border: 3px solid #111111; padding: 0 8px; background: {{sel.rarityColor}}">{{sel.rarityUpper}}</span>
        <span style="font-style: italic; font-weight: 500; font-size: 13px">“{{sel.tagline}}”</span>
      </div>
      <div style="font-size: 13px; line-height: 1.3"><span style="font-weight: 800">Ultimate · {{sel.ult}}:</span> {{sel.ultDesc}}</div>
    </div>
    <a href="C-Character.dc.html" style="align-self: center; flex-shrink: 0; width: 180px; height: 60px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 26px; letter-spacing: 2px; color: #FFFFFF; background: #E5262B; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; transform: skewX(-6deg)">OPEN PAGE</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const rar = { Common: '#9AA3C0', Rare: '#4F9DFF', Epic: '#B169FF', Legendary: '#FFC21A', Mythic: '#FF4D6D' };
const data = [
  { id: 'bubu', name: 'Bubu', rarity: 'Common', color: '#5AD15A', tagline: 'Round, cheerful, starts with a bang.', ult: 'Big Bang', ultDesc: 'Drops a giant bomb (+2 range) on top of your normal ones.', state: 'Selected · Lv 3' },
  { id: 'gugu', name: 'Gugu', rarity: 'Common', color: '#B08A5A', tagline: 'Heavy, stubborn, hard to get rid of.', ult: 'Earthquake', ultDesc: 'Shoves every bomb within 2 tiles away from him.', state: 'Lv 2' },
  { id: 'zuzu', name: 'Zuzu', rarity: 'Common', color: '#E0A35A', tagline: 'Blink and you missed her.', ult: 'Dash', ultDesc: 'Dashes up to 3 tiles in the direction she faces.', state: 'Lv 1' },
  { id: 'striker', name: 'Striker', rarity: 'Rare', color: '#2FB4FF', tagline: 'Every bomb is a ball.', ult: 'Penalty', ultDesc: 'Kicks every bomb in his line of sight, all at once.', state: 'Free this week', hot: true },
  { id: 'fifi', name: 'Fifi', rarity: 'Epic', color: '#FF9AD0', tagline: 'Graceful, and grabs everything.', ult: 'Cluster', ultDesc: 'Four mini-bombs in a cross, two tiles away.', state: '600 Fitile', dim: true },
  { id: 'veta', name: 'Auntie Veta', short: 'Auntie Veta', rarity: 'Epic', color: '#FFB870', tagline: 'Handbag, headscarf, zero patience.', ult: 'The Handbag', ultDesc: 'Swings a bomb 4 to 9 tiles away, over walls.', state: '600 Fitile', dim: true },
  { id: 'chef', name: 'Chef', rarity: 'Epic', color: '#F4F4F8', tagline: 'Cooks with fire. Literally.', ult: 'Sticky Sauce', ultDesc: 'Kicks a sticky bomb that glues itself to the first player it hits.', state: 'Player Lv 6', dim: true },
  { id: 'maestru', name: 'Master Fitil', short: 'Master Fitil', rarity: 'Legendary', color: '#9AD7FF', tagline: 'Knows every fuse by heart.', ult: 'Time Stop', ultDesc: 'For 1.5s everyone else’s bombs freeze. His keep ticking.', state: 'Player Lv 8', dim: true },
  { id: 'robo', name: 'Robo-Mici', rarity: 'Legendary', color: '#C8CCD8', tagline: 'Beep. Boop. Boom.', ult: 'Portal Jump', ultDesc: 'Teleports to the farther portal, or to a safe spot far away.', state: 'Player Lv 10', dim: true },
  { id: 'ghost', name: 'Ghost', rarity: 'Mythic', color: '#E8F0FF', tagline: 'Crates? What crates?', ult: 'Boo!', ultDesc: 'Invisible to opponents for 2 seconds.', state: 'Coming in 12 days', dim: true },
  { id: 'magician', name: 'Magician', rarity: 'Mythic', color: '#8A5CFF', tagline: 'Now you see the bomb… now it’s a pigeon.', ult: 'Switcheroo', ultDesc: 'Swaps places with the nearest opponent.', state: 'Coming in 40 days', dim: true }
];
const tilts = ['rotate(-2deg)', 'rotate(1.500deg)', 'rotate(-1deg)', 'rotate(2deg)', 'rotate(-1.500deg)', 'rotate(1deg)'];
const picked = (this.state && this.state.picked) || 'bubu';
const roster = data.map((c, i) => ({
  ...c,
  short: c.short || c.name,
  selected: c.id === picked,
  rarityColor: rar[c.rarity],
  bg: c.id === picked ? '#FFFFFF' : '#FFF3B0',
  shadow: c.id === picked ? '5px 5px 0 #E5262B' : '3px 3px 0 #111111',
  tilt: c.id === picked ? 'rotate(0deg) translateY(-3px)' : tilts[i % 6],
  opacity: c.dim ? 0.45 : 1,
  stateColor: c.hot ? '#5BE36A' : '#FFD60A',
  pick: () => this.setState({ picked: c.id })
}));
const s = data.find((c) => c.id === picked);
return { roster, sel: { ...s, rarityColor: rar[s.rarity], rarityUpper: s.rarity.toUpperCase() } };
}
}
</script>
</body>
</html>
