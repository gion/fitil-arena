<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Finding players (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:ital,wght@0,500;0,700;0,800;1,500&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #FFD60A; background-image: radial-gradient(#F2B600 24%, transparent 25%); background-size: 14px 14px; color: #111111; font-family: 'Rubik', sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 14px 56px 20px">
  <div style="display: flex; align-items: center; gap: 14px">
    <h1 style="margin: 0; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; color: #FFD60A; background: #111111; padding: 2px 18px; transform: skewX(-8deg)">FINDING PLAYERS…</h1>
    <div style="font-style: italic; font-weight: 500; font-size: 14px; background: #FFF3B0; border: 3px solid #111111; padding: 4px 12px">Somewhere, three strangers are lacing up…</div>
    <div style="margin-left: auto; background: #FFFFFF; border: 3px solid #111111; padding: 4px 12px; font-weight: 800; font-size: 13px">Classic · 4 players</div>
  </div>

  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; min-height: 0">
    <sc-for list="{{slots}}" as="p" hint-placeholder-count="4">
      <div style="position: relative; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; background: {{p.bg}}; border: 4px {{p.borderStyle}} #111111; box-shadow: {{p.shadow}}; transform: {{p.tilt}}">
        <sc-if value="{{p.found}}" hint-placeholder-val="{{true}}">
          <svg viewBox="0 -8 100 118" style="width: 96px; height: 113px" aria-hidden="true">
            <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
            <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
            <circle cx="72" cy="4" r="6" fill="{{p.color}}" style="stroke: #12131C; stroke-width: 3"/>
            <circle cx="50" cy="58" r="38" fill="{{p.color}}" style="stroke: #12131C; stroke-width: 5"/>
            <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
            <circle cx="38" cy="55" r="4" style="fill: #12131C"/><circle cx="66" cy="55" r="4" style="fill: #12131C"/>
          </svg>
        </sc-if>
        <sc-if value="{{p.searching}}" hint-placeholder-val="{{false}}">
          <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; font-family: 'Bangers', sans-serif; font-size: 110px; line-height: 1; color: #FFFFFF; -webkit-text-stroke: 8px #111111; paint-order: stroke fill; transform: rotate(8deg)">?</div>
        </sc-if>
        <div style="width: 100%; text-align: center; background: #111111; color: #FFFFFF; padding: 3px 0; margin-top: 4px; font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px">{{p.name}}</div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 16px">
    <div style="flex-grow: 1; background: #FFF3B0; border: 3px solid #111111; padding: 8px 14px; font-weight: 500; font-size: 14px; line-height: 1.3"><span style="font-weight: 800">2 of 4 found.</span> If nobody else shows up, bots take the empty seats.</div>
    <div style="font-family: 'Bangers', sans-serif; font-size: 30px; letter-spacing: 2px; background: #FFFFFF; border: 3px solid #111111; padding: 4px 14px">0:07</div>
    <a href="C-Home.dc.html" style="flex-shrink: 0; width: 150px; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 26px; letter-spacing: 1px; color: #111111; background: #FFFFFF; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; transform: skewX(-6deg)">CANCEL</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const defs = [
  { name: 'Gion (you)', color: '#FFD23F', found: true, tilt: 'rotate(-1deg)' },
  { name: 'NoBrakes', color: '#FF5F93', found: true, tilt: 'rotate(1deg)' },
  { name: 'Searching…', found: false, tilt: 'rotate(-0.500deg)' },
  { name: 'Searching…', found: false, tilt: 'rotate(1.500deg)' }
];
const slots = defs.map((p) => ({
  ...p,
  searching: !p.found,
  bg: p.found ? '#19B5E8' : 'transparent',
  borderStyle: p.found ? 'solid' : 'dashed',
  shadow: p.found ? '5px 5px 0 #111111' : 'none'
}));
return { slots };
}
}
</script>
</body>
</html>
