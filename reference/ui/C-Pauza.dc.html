<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Pause (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:ital,wght@0,500;0,700;0,800;1,500&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #679D48; background-image: linear-gradient(45deg, rgba(0,0,0,0.1) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.1) 75%), linear-gradient(45deg, rgba(0,0,0,0.1) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.1) 75%); background-size: 96px 96px; background-position: 0 0, 48px 48px; color: #111111; font-family: 'Rubik', sans-serif; display: flex; align-items: center; justify-content: center">
  <div style="position: absolute; left: 96px; top: 48px; width: 48px; height: 48px; background: #646C85; border: 3px solid #111111; box-sizing: border-box"></div>
  <div style="position: absolute; left: 720px; top: 48px; width: 48px; height: 48px; background: #C8834A; border: 3px solid #111111; box-sizing: border-box"></div>
  <div style="position: absolute; left: 48px; top: 288px; width: 48px; height: 48px; background: #C8834A; border: 3px solid #111111; box-sizing: border-box"></div>
  <div style="position: absolute; inset: 0; background-color: rgba(17,17,17,0.74); background-image: radial-gradient(rgba(255,214,10,0.22) 24%, transparent 25%); background-size: 14px 14px"></div>

  <div style="position: relative; width: 600px; box-sizing: border-box; background: #FFFFFF; border: 4px solid #111111; box-shadow: 8px 8px 0 #E5262B; padding: 18px 20px 16px; display: flex; gap: 18px; transform: rotate(-1deg)">
    <div style="position: absolute; left: -14px; top: -18px; font-style: italic; font-weight: 500; font-size: 14px; background: #FFF3B0; border: 3px solid #111111; padding: 3px 12px; transform: rotate(-2deg)">Meanwhile, the bombs are waiting…</div>
    <div style="width: 160px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; background: #19B5E8; border: 3px solid #111111; position: relative; overflow: hidden">
      <div style="position: absolute; right: 8px; top: 10px; background: #FFFFFF; border: 3px solid #111111; border-radius: 50%; padding: 6px 12px; font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 2px">Zzz</div>
      <svg viewBox="0 -8 100 118" style="width: 120px; height: 142px" aria-hidden="true">
        <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
        <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
        <circle cx="72" cy="4" r="6" style="fill: #FFD23F; stroke: #12131C; stroke-width: 3"/>
        <circle cx="50" cy="58" r="38" style="fill: #FFD23F; stroke: #12131C; stroke-width: 5"/>
        <path d="M28 54 q8 7 16 0M56 54 q8 7 16 0" style="fill: none; stroke: #12131C; stroke-width: 4.500; stroke-linecap: round"/>
        <ellipse cx="50" cy="72" rx="5" ry="6" style="fill: #12131C"/>
      </svg>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px">
      <h1 style="margin: 0; align-self: flex-start; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: 4px; color: #FFD60A; background: #111111; padding: 4px 22px; transform: skewX(-8deg)">PAUSED</h1>
      <a href="C-Game.dc.html" style="height: 68px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 36px; letter-spacing: 3px; color: #FFFFFF; background: #E5262B; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; transform: skewX(-6deg)">BACK TO THE BOOM!</a>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
        <button type="button" style="height: 50px; font-family: 'Bangers', sans-serif; font-size: 22px; letter-spacing: 1px; color: #111111; background: #FFFFFF; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; transform: skewX(-6deg); cursor: pointer">NEW ROUND</button>
        <a href="C-Home.dc.html" style="height: 50px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 22px; letter-spacing: 1px; color: #111111; background: #FFFFFF; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; transform: skewX(-6deg)">LEAVE MATCH</a>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{q.on}}" onClick="{{q.flip}}" style="flex-grow: 1; height: 46px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px; font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 13px; color: #111111; background: #FFF3B0; border: 3px solid #111111; cursor: pointer">
            <span>{{q.label}}</span>
            <span style="font-family: 'Bangers', sans-serif; font-size: 18px; letter-spacing: 1px; color: {{q.fg}}; background: {{q.bg}}; border: 3px solid #111111; padding: 0 6px; transform: rotate(-4deg)">{{q.state}}</span>
          </button>
        </sc-for>
        <a href="C-Setari.dc.html" aria-label="All settings" style="flex-shrink: 0; width: 46px; height: 46px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 3px solid #111111">
          <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #111111; stroke-width: 2.800; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><circle cx="12" cy="12" r="3.500"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
        </a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const on = { music: true, sounds: true, haptics: false, ...((this.state && this.state.on) || {}) };
const quick = [
  { id: 'music', label: 'Music' },
  { id: 'sounds', label: 'Sounds' },
  { id: 'haptics', label: 'Haptics' }
].map((q) => ({
  ...q,
  on: !!on[q.id],
  state: on[q.id] ? 'ON' : 'OFF',
  bg: on[q.id] ? '#5BE36A' : '#FFFFFF',
  fg: on[q.id] ? '#111111' : '#B3151A',
  flip: () => this.setState({ on: { ...on, [q.id]: !on[q.id] } })
}));
return { quick };
}
}
</script>
</body>
</html>
