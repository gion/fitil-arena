<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Character page (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:ital,wght@0,500;0,700;0,800;1,500&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #FFD60A; background-image: radial-gradient(#F2B600 24%, transparent 25%); background-size: 14px 14px; color: #111111; font-family: 'Rubik', sans-serif; display: flex; gap: 20px; padding: 16px 56px 20px">
  <div style="width: 240px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px">
    <div style="position: relative; flex-grow: 1; overflow: hidden; background: #19B5E8; border: 4px solid #111111; box-shadow: 6px 6px 0 #111111; transform: rotate(-1.500deg); display: flex; align-items: flex-end; justify-content: center">
      <div style="position: absolute; left: -280px; top: -260px; width: 800px; height: 800px; border-radius: 50%; background: repeating-conic-gradient(#5CCBF0 0deg 9deg, #19B5E8 9deg 18deg)"></div>
      <div style="position: absolute; left: 10px; right: 10px; top: 10px; background: #FFFFFF; border: 3px solid #111111; border-radius: 22px 22px 22px 6px; padding: 6px 10px; font-weight: 800; font-size: 13px; line-height: 1.2; text-align: center">{{c.tagline}}</div>
      <svg viewBox="0 -8 100 118" style="position: relative; width: 150px; height: 177px" aria-hidden="true">
        <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
        <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
        <circle cx="72" cy="4" r="6" fill="{{c.color}}" style="stroke: #12131C; stroke-width: 3"/>
        <circle cx="50" cy="58" r="38" fill="{{c.color}}" style="stroke: #12131C; stroke-width: 5"/>
        <path d="M28 56 q8 -11 16 0M56 56 q8 -11 16 0" style="fill: none; stroke: #12131C; stroke-width: 4.500; stroke-linecap: round"/>
        <path d="M40 68 a10 10 0 0 0 20 0z" style="fill: #12131C"/>
      </svg>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button type="button" style="height: 48px; font-family: 'Bangers', sans-serif; font-size: 22px; letter-spacing: 1px; color: #111111; background: #FFFFFF; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; transform: skewX(-6deg); cursor: pointer">LISTEN</button>
      <a href="C-Game.dc.html" style="height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 22px; letter-spacing: 1px; color: #111111; background: #19B5E8; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; transform: skewX(-6deg)">TRY</a>
    </div>
  </div>

  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="C-Personaje.dc.html" aria-label="Back" style="width: 46px; height: 46px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111">
        <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 style="margin: 0; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 34px; letter-spacing: 2px; color: #FFD60A; background: #111111; padding: 2px 18px; transform: skewX(-8deg)">{{c.name}}</h1>
      <span style="font-weight: 800; font-size: 12px; letter-spacing: 1px; border: 3px solid #111111; padding: 1px 8px; background: {{c.rarityColor}}">{{c.rarity}}</span>
    </div>
    <div style="background: #FFF3B0; border: 3px solid #111111; padding: 6px 12px; font-size: 14px; line-height: 1.3"><span style="font-weight: 800">Ultimate · {{c.ult}}:</span> {{c.ultDesc}}</div>
    <div>
      <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; margin-bottom: 4px"><span>{{c.levelLine}}</span><span>{{c.xpLine}}</span></div>
      <div style="height: 18px; box-sizing: border-box; background: #FFFFFF; border: 3px solid #111111"><div style="height: 100%; background: #E5262B; width: {{c.xpPct}}"></div></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{rewards}}" as="r" hint-placeholder-count="5">
        <div style="height: 62px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.15; background: {{r.bg}}; border: 3px {{r.border}} #111111; padding: 0 4px">
          <span style="font-family: 'Bangers', sans-serif; font-size: 16px; letter-spacing: 1px">{{r.level}}</span>
          <span style="font-weight: 700; font-size: 11.500px">{{r.what}}</span>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 14px">
      <div style="flex-grow: 1; font-weight: 500; font-size: 13px; line-height: 1.3">{{c.note}}</div>
      <button type="button" onClick="{{toggle}}" style="flex-shrink: 0; min-width: 230px; height: 60px; padding: 0 16px; font-family: 'Bangers', sans-serif; font-size: 26px; letter-spacing: 1px; color: {{c.ctaFg}}; background: {{c.ctaBg}}; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; transform: skewX(-6deg); cursor: pointer">{{c.cta}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"character":{"editor":"enum","options":["owned","for sale"],"default":"owned"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const base = (this.props.character ?? 'owned') === 'owned';
const flipped = !!(this.state && this.state.flipped);
const owned = base !== flipped;
const c = owned
  ? { name: 'BUBU', rarity: 'COMMON', rarityColor: '#9AA3C0', color: '#5AD15A', tagline: 'Round, cheerful, starts with a bang.', ult: 'Big Bang', ultDesc: 'Drops a giant bomb (+2 range) on top of your normal ones.', levelLine: 'Level 3', xpLine: '140/300 XP', xpPct: '47%', note: 'Selected. XP comes from matches, doubled for the first one each day.', cta: 'SELECTED', ctaBg: '#FFFFFF', ctaFg: '#111111' }
  : { name: 'FIFI', rarity: 'EPIC', rarityColor: '#B169FF', color: '#FF9AD0', tagline: 'Graceful, and grabs everything.', ult: 'Cluster', ultDesc: 'Four mini-bombs in a cross, two tiles away.', levelLine: 'Level 1', xpLine: '0/100 XP', xpPct: '0%', note: 'You have 850 Fitile. Everything you unlock stays yours.', cta: 'BUY FOR 600 FITILE', ctaBg: '#E5262B', ctaFg: '#FFFFFF' };
const got = owned ? 3 : 1;
const rewards = [['LV 2', '+50 Fitile'], ['LV 3', 'Cap'], ['LV 4', '+80 Fitile'], ['LV 5', 'title “Boom Baby”'], ['LV 6', 'Party hat']].map((r, i) => ({
  level: r[0],
  what: r[1],
  bg: i + 2 <= got ? '#5BE36A' : '#FFFFFF',
  border: i + 2 <= got ? 'solid' : 'dashed'
}));
return { c, rewards, toggle: () => this.setState({ flipped: !flipped }) };
}
}
</script>
</body>
</html>
