<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Round start (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:ital,wght@0,500;0,700;0,800;1,500&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background: #111111; color: #111111; font-family: 'Rubik', sans-serif">
  <div style="position: absolute; left: -30px; right: -30px; top: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; transform: skewX(-8deg)">
    <sc-for list="{{fighters}}" as="f" hint-placeholder-count="4">
      <div style="position: relative; overflow: hidden; background: {{f.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: flex-end">
        <div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(17,17,17,0.18) 24%, transparent 25%); background-size: 14px 14px"></div>
        <svg viewBox="0 -8 100 118" style="position: relative; width: 150px; height: 177px; margin-bottom: 54px; transform: skewX(8deg)" aria-hidden="true">
          <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
          <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
          <circle cx="72" cy="4" r="6" fill="{{f.color}}" style="stroke: #12131C; stroke-width: 3"/>
          <circle cx="50" cy="58" r="38" fill="{{f.color}}" style="stroke: #12131C; stroke-width: 5"/>
          <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
          <circle cx="38" cy="55" r="4" style="fill: #12131C"/><circle cx="66" cy="55" r="4" style="fill: #12131C"/>
          <path d="M25 40 l16 5M75 40 l-16 5" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
        </svg>
        <div style="position: absolute; left: 0; right: 0; bottom: 60px; text-align: center; font-family: 'Bangers', sans-serif; font-size: 26px; letter-spacing: 1px; color: #FFFFFF; background: #111111; padding: 2px 0">{{f.name}}</div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 56px; top: 14px; background: #FFFFFF; border: 3px solid #111111; padding: 2px 10px; font-weight: 800; font-size: 12px; letter-spacing: 1px">CLASSIC ARENA · FREE-FOR-ALL</div>
  <div style="position: absolute; left: 0; right: 0; top: 40px; display: flex; flex-direction: column; align-items: center; gap: 2px">
    <div style="font-family: 'Bangers', sans-serif; font-size: 30px; letter-spacing: 3px; color: #FFD60A; background: #111111; padding: 2px 20px; transform: skewX(-8deg)">ROUND 1</div>
    <a href="C-Game.dc.html" style="text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 96px; line-height: 1; letter-spacing: 4px; color: #FFD60A; -webkit-text-stroke: 10px #111111; paint-order: stroke fill; text-shadow: 7px 7px 0 #111111; transform: rotate(-3deg)">GET READY!</a>
  </div>
  <div style="position: absolute; left: 56px; right: 56px; bottom: 14px; display: flex; justify-content: center">
    <div style="background: #FFF3B0; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; padding: 5px 14px; font-size: 14px; line-height: 1.3"><span style="font-weight: 800">ARENA EVENT · East wind:</span> kicked bombs travel further this round.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const fighters = [
  { name: 'GION', color: '#FFD23F', bg: '#19B5E8' },
  { name: 'MARA', color: '#FF5F93', bg: '#FFD60A' },
  { name: 'VLAD', color: '#4FC3FF', bg: '#E5262B' },
  { name: 'BOT NELU', color: '#7DFFB0', bg: '#C79BFF' }
];
return { fighters };
}
}
</script>
</body>
</html>
