<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Private room (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #FFD60A; background-image: radial-gradient(#F2B600 24%, transparent 25%); background-size: 14px 14px; color: #111111; font-family: 'Rubik', sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 14px 56px 20px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="C-Online.dc.html" aria-label="Leave room" style="width: 46px; height: 46px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; color: #FFD60A; background: #111111; padding: 2px 18px; transform: skewX(-8deg)">ROOM</h1>
    <span style="font-family: 'Bangers', sans-serif; font-size: 34px; line-height: 1; letter-spacing: 8px; background: #FFFFFF; border: 3px dashed #111111; padding: 2px 6px 2px 14px">BOOM</span>
    <button type="button" style="height: 46px; padding: 0 14px; font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px; color: #111111; background: #19B5E8; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111; cursor: pointer">SHARE</button>
    <div style="margin-left: auto; font-style: italic; font-weight: 500; font-size: 13px; background: #FFF3B0; border: 3px solid #111111; padding: 4px 12px">Share the code with your friends, then press Start.</div>
  </div>

  <div style="flex-grow: 1; display: flex; gap: 16px; min-height: 0">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0">
      <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; min-height: 0">
        <sc-for list="{{slots}}" as="p" hint-placeholder-count="4">
          <div style="position: relative; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; background: {{p.bg}}; border: 4px {{p.borderStyle}} #111111; box-shadow: {{p.shadow}}; transform: {{p.tilt}}">
            <div style="position: absolute; left: 6px; right: 6px; top: 6px; background: #FFFFFF; border: 3px solid #111111; border-radius: 16px 16px 16px 4px; padding: 3px 6px; font-weight: 700; font-size: 12px; line-height: 1.2; text-align: center">{{p.say}}</div>
            <svg viewBox="0 -8 100 118" style="width: 74px; height: 87px; opacity: {{p.opacity}}" aria-hidden="true">
              <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
              <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
              <circle cx="72" cy="4" r="6" fill="{{p.color}}" style="stroke: #12131C; stroke-width: 3"/>
              <circle cx="50" cy="58" r="38" fill="{{p.color}}" style="stroke: #12131C; stroke-width: 5"/>
              <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
              <circle cx="38" cy="55" r="4" style="fill: #12131C"/><circle cx="66" cy="55" r="4" style="fill: #12131C"/>
            </svg>
            <div style="width: 100%; text-align: center; background: #111111; color: #FFFFFF; padding: 2px 0; line-height: 1.15">
              <div style="font-family: 'Bangers', sans-serif; font-size: 18px; letter-spacing: 1px">{{p.name}}</div>
              <div style="font-weight: 700; font-size: 11px; color: #FFD60A">{{p.tag}}</div>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 12px">
        <a href="C-Personaje.dc.html" style="flex-grow: 1; height: 50px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px; color: #111111; background: #FFFFFF; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; transform: skewX(-6deg)">YOUR CHARACTER: BUBU</a>
        <a href="C-Online.dc.html" style="width: 150px; height: 50px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px; color: #111111; background: #FFFFFF; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; transform: skewX(-6deg)">LEAVE ROOM</a>
      </div>
    </div>

    <div style="width: 250px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
      <div style="background: #FFFFFF; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; padding: 4px 0; transform: rotate(1deg)">
        <sc-for list="{{rules}}" as="r" hint-placeholder-count="5">
          <button type="button" style="width: 100%; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-family: 'Rubik', sans-serif; color: #111111; background: transparent; border: 0; border-bottom: {{r.line}}; cursor: pointer; text-align: left">
            <span style="font-weight: 800; font-size: 12px; letter-spacing: 1px; width: 62px">{{r.label}}</span>
            <span style="font-family: 'Bangers', sans-serif; font-size: 19px; letter-spacing: 0.500px">{{r.value}}</span>
            <svg viewBox="0 0 24 24" style="margin-left: auto; width: 16px; height: 16px; fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </sc-for>
      </div>
      <a href="C-RoundStart.dc.html" style="margin-top: auto; height: 62px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 36px; letter-spacing: 3px; color: #FFFFFF; background: #E5262B; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; transform: skewX(-6deg)">START!</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const defs = [
  { name: 'Gion', color: '#5AD15A', tag: 'HOST · Bubu', say: 'Come on already!', tilt: 'rotate(-1deg)' },
  { name: 'Mara', color: '#FF9AD0', tag: 'Fifi', say: 'Been ready since yesterday.', tilt: 'rotate(1deg)' },
  { name: 'Vlad', color: '#2FB4FF', tag: 'Striker', say: 'Wait, my shoelaces.', tilt: 'rotate(-0.500deg)' },
  { name: 'Open seat', color: '#FFFFFF', tag: 'a bot takes it', say: 'Beep?', tilt: 'rotate(1.500deg)', empty: true }
];
const slots = defs.map((p) => ({
  ...p,
  bg: p.empty ? 'transparent' : '#19B5E8',
  borderStyle: p.empty ? 'dashed' : 'solid',
  shadow: p.empty ? 'none' : '4px 4px 0 #111111',
  opacity: p.empty ? 0.55 : 1
}));
const list = [['MODE', 'Free for all'], ['RULES', 'Characters'], ['BOTS', 'Normal'], ['THEME', 'Classic'], ['EVENTS', 'On']];
const rules = list.map((r, i) => ({ label: r[0], value: r[1], line: i < list.length - 1 ? '3px solid #111111' : '0' }));
return { slots, rules };
}
}
</script>
</body>
</html>
