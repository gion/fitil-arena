<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Private room (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #FFD60A; background-image: radial-gradient(#F2B600 24%, transparent 25%); background-size: 14px 14px; color: #111111; font-family: 'Rubik', sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 14px 56px 20px">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="C-Home.dc.html" aria-label="Back" style="width: 46px; height: 46px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; color: #FFD60A; background: #111111; padding: 2px 18px; transform: skewX(-8deg)">PRIVATE ROOM</h1>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 8px">
      <span style="font-weight: 800; font-size: 13px">CODE:</span>
      <span style="font-family: 'Bangers', sans-serif; font-size: 34px; line-height: 1; letter-spacing: 8px; background: #FFFFFF; border: 3px dashed #111111; padding: 2px 6px 2px 14px">BOOM</span>
      <button type="button" style="height: 46px; padding: 0 14px; font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px; color: #111111; background: #19B5E8; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111; cursor: pointer">SHARE</button>
    </div>
  </div>

  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; min-height: 0">
    <sc-for list="{{slots}}" as="p" hint-placeholder-count="4">
      <div style="position: relative; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; background: {{p.bg}}; border: 4px {{p.borderStyle}} #111111; box-shadow: {{p.shadow}}; transform: {{p.tilt}}">
        <div style="position: absolute; left: 8px; right: 8px; top: 8px; background: #FFFFFF; border: 3px solid #111111; border-radius: 18px 18px 18px 4px; padding: 5px 8px; font-weight: 700; font-size: 13px; line-height: 1.2; text-align: center">{{p.say}}</div>
        <svg viewBox="0 -8 100 118" style="width: 92px; height: 108px; opacity: {{p.opacity}}" aria-hidden="true">
          <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
          <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
          <circle cx="72" cy="4" r="6" fill="{{p.color}}" style="stroke: #12131C; stroke-width: 3"/>
          <circle cx="50" cy="58" r="38" fill="{{p.color}}" style="stroke: #12131C; stroke-width: 5"/>
          <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
          <circle cx="38" cy="55" r="4" style="fill: #12131C"/><circle cx="66" cy="55" r="4" style="fill: #12131C"/>
        </svg>
        <div style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: #111111; color: #FFFFFF; padding: 3px 0; margin-top: 4px">
          <span style="font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px">{{p.name}}</span>
          <span style="font-weight: 800; font-size: 11px; letter-spacing: 1px; color: #111111; background: {{p.tagBg}}; padding: 1px 6px">{{p.tag}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 16px">
    <a href="C-Mod.dc.html" style="flex-grow: 1; min-height: 44px; display: flex; align-items: center; text-decoration: none; background: #FFF3B0; border: 3px solid #111111; padding: 4px 14px; font-weight: 500; font-size: 14px; line-height: 1.3"><span><span style="font-weight: 800">Host rules:</span> Classic · 3 rounds · bots fill empty seats · <span style="text-decoration: underline">change</span></span></a>
    <button type="button" style="flex-shrink: 0; width: 150px; height: 56px; font-family: 'Bangers', sans-serif; font-size: 24px; letter-spacing: 1px; color: #111111; background: #FFFFFF; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; transform: skewX(-6deg); cursor: pointer">I'M READY</button>
    <a href="C-Game.dc.html" style="flex-shrink: 0; width: 190px; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 34px; letter-spacing: 3px; color: #FFFFFF; background: #E5262B; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; transform: skewX(-6deg)">START!</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const defs = [
  { name: 'Gion', color: '#FFD23F', tag: 'HOST', tagBg: '#FFD60A', say: 'Come on already!', tilt: 'rotate(-1deg)' },
  { name: 'Mara', color: '#FF5F93', tag: 'READY', tagBg: '#5BE36A', say: 'Been ready since yesterday.', tilt: 'rotate(1deg)' },
  { name: 'Vlad', color: '#4FC3FF', tag: 'NOT YET', tagBg: '#FFFFFF', say: 'Wait, tying my shoelaces.', tilt: 'rotate(-0.500deg)' },
  { name: 'Open seat', color: '#FFFFFF', tag: 'BOT', tagBg: '#FFFFFF', say: 'Beep? I can fill in.', tilt: 'rotate(1.500deg)', empty: true }
];
const slots = defs.map((p) => ({
  ...p,
  bg: p.empty ? 'transparent' : '#19B5E8',
  borderStyle: p.empty ? 'dashed' : 'solid',
  shadow: p.empty ? 'none' : '5px 5px 0 #111111',
  opacity: p.empty ? 0.55 : 1
}));
return { slots };
}
}
</script>
</body>
</html>
