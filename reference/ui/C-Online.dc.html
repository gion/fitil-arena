<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Online (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #FFD60A; background-image: radial-gradient(#F2B600 24%, transparent 25%); background-size: 14px 14px; color: #111111; font-family: 'Rubik', sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 14px 56px 22px">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="C-Home.dc.html" aria-label="Back" style="width: 46px; height: 46px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; color: #FFD60A; background: #111111; padding: 2px 18px; transform: skewX(-8deg)">ONLINE</h1>
    <label style="margin-left: auto; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13px">YOUR NAME
      <input type="text" value="Gion" maxlength="12" style="width: 150px; height: 44px; box-sizing: border-box; padding: 0 10px; font-family: 'Bangers', sans-serif; font-size: 22px; letter-spacing: 1px; color: #111111; background: #FFFFFF; border: 3px solid #111111">
    </label>
    <a href="C-Personaje.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 12px 0 6px; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px; color: #111111; background: #19B5E8; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111">
      <span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; background: #5AD15A; border: 3px solid #111111"></span>BUBU
    </a>
  </div>

  <div style="flex-grow: 1; display: flex; gap: 22px; min-height: 0">
    <section style="flex-grow: 1; box-sizing: border-box; background: #FFFFFF; border: 4px solid #111111; box-shadow: 6px 6px 0 #111111; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; transform: rotate(-1deg)">
      <h2 style="margin: 0; align-self: flex-start; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 22px; letter-spacing: 1px; background: #19B5E8; border: 3px solid #111111; padding: 0 12px; transform: skewX(-8deg)">QUICK PLAY</h2>
      <div style="font-weight: 500; font-size: 13px; line-height: 1.3">Jump into a public match. Bots fill the empty seats.</div>
      <div role="group" aria-label="Quick play mode" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="6">
          <button type="button" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="height: 44px; padding: 0 4px; font-family: 'Bangers', sans-serif; font-size: 17px; letter-spacing: 0.500px; color: {{m.fg}}; background: {{m.bg}}; border: 3px solid #111111; cursor: pointer">{{m.label}}</button>
        </sc-for>
      </div>
      <a href="C-Matchmaking.dc.html" style="margin-top: auto; height: 68px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 34px; letter-spacing: 2px; color: #FFFFFF; background: #E5262B; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; transform: skewX(-6deg)">QUICK PLAY!</a>
    </section>

    <section style="width: 300px; flex-shrink: 0; box-sizing: border-box; background: #FFFFFF; border: 4px solid #111111; box-shadow: 6px 6px 0 #111111; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; transform: rotate(1deg)">
      <h2 style="margin: 0; align-self: flex-start; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 22px; letter-spacing: 1px; background: #FFD60A; border: 3px solid #111111; padding: 0 12px; transform: skewX(-8deg)">PRIVATE ROOM</h2>
      <a href="C-Lobby.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 26px; letter-spacing: 1px; color: #111111; background: #19B5E8; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; transform: skewX(-6deg)">CREATE A ROOM</a>
      <div style="display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 12px; letter-spacing: 1px"><span style="flex-grow: 1; height: 3px; background: #111111"></span>OR JOIN WITH A CODE<span style="flex-grow: 1; height: 3px; background: #111111"></span></div>
      <div style="margin-top: auto; display: flex; gap: 10px">
        <input type="text" aria-label="Room code" placeholder="CODE" maxlength="4" style="flex-grow: 1; min-width: 0; height: 56px; box-sizing: border-box; text-align: center; font-family: 'Bangers', sans-serif; font-size: 32px; letter-spacing: 10px; color: #111111; background: #FFF3B0; border: 3px dashed #111111">
        <a href="C-Lobby.dc.html" style="width: 100px; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Bangers', sans-serif; font-size: 26px; letter-spacing: 1px; color: #111111; background: #FFFFFF; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; transform: skewX(-6deg)">JOIN</a>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.mode) || 'Free for all';
const modes = ['Free for all', '1 vs 1', 'Teams 2v2', 'Teams 3v3', 'Capture the flag', 'Crown'].map((label) => ({
  label,
  on: label === picked,
  bg: label === picked ? '#111111' : '#FFFFFF',
  fg: label === picked ? '#FFD60A' : '#111111',
  pick: () => this.setState({ mode: label })
}));
return { modes };
}
}
</script>
</body>
</html>
