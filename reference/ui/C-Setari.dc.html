<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Settings (C)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#B3151A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #FFD60A; background-image: radial-gradient(#F2B600 24%, transparent 25%); background-size: 14px 14px; color: #111111; font-family: 'Rubik', sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 14px 56px 20px">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="C-Home.dc.html" aria-label="Back" style="width: 46px; height: 46px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; color: #FFD60A; background: #111111; padding: 2px 18px; transform: skewX(-8deg)">SETTINGS</h1>
    <div style="margin-left: auto; background: #FFFFFF; border: 3px solid #111111; padding: 4px 10px; font-weight: 500; font-size: 12px">version [X.Y.Z]</div>
  </div>

  <div style="flex-grow: 1; display: flex; gap: 18px; min-height: 0">
    <div style="flex-grow: 1; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-content: start">
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="4">
        <button type="button" role="switch" aria-checked="{{t.on}}" onClick="{{t.flip}}" style="height: 86px; padding: 0 12px; display: flex; align-items: center; gap: 10px; text-align: left; font-family: 'Rubik', sans-serif; color: #111111; background: #FFFFFF; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; cursor: pointer">
          <span style="display: flex; flex-direction: column; line-height: 1.2">
            <span style="font-family: 'Bangers', sans-serif; font-size: 22px; letter-spacing: 1px">{{t.label}}</span>
            <span style="font-weight: 500; font-size: 12px">{{t.hint}}</span>
          </span>
          <span style="margin-left: auto; flex-shrink: 0; width: 56px; text-align: center; font-family: 'Bangers', sans-serif; font-size: 26px; letter-spacing: 1px; color: {{t.fg}}; background: {{t.bg}}; border: 3px solid {{t.fg}}; transform: rotate({{t.rot}})">{{t.state}}</span>
        </button>
      </sc-for>
    </div>

    <section style="width: 270px; flex-shrink: 0; box-sizing: border-box; background: #FFFFFF; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 6px; transform: rotate(1deg)">
      <h2 style="margin: 0; align-self: flex-start; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 20px; letter-spacing: 1px; color: #111111; background: #19B5E8; border: 3px solid #111111; padding: 0 10px; transform: skewX(-8deg)">PICTURE</h2>
      <div style="font-weight: 800; font-size: 13px; margin-top: 4px">3D graphics quality</div>
      <div role="group" aria-label="3D graphics quality" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 3px solid #111111">
        <sc-for list="{{quality}}" as="q" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{q.on}}" onClick="{{q.pick}}" style="height: 44px; padding: 0; font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px; color: {{q.fg}}; background: {{q.bg}}; border: 0; cursor: pointer">{{q.label}}</button>
        </sc-for>
      </div>
      <div style="font-weight: 800; font-size: 13px; margin-top: 8px">View</div>
      <div role="group" aria-label="Default view" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 3px solid #111111">
        <sc-for list="{{views}}" as="q" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{q.on}}" onClick="{{q.pick}}" style="height: 44px; padding: 0; font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px; color: {{q.fg}}; background: {{q.bg}}; border: 0; cursor: pointer">{{q.label}}</button>
        </sc-for>
      </div>
      <div style="margin-top: auto; font-weight: 500; font-size: 12px; line-height: 1.3">Your progress is saved on this phone.</div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const on = { sound: true, music: true, vibration: true, motion: true, ...(st.on || {}) };
const defs = [
  { id: 'sound', label: 'Sound', hint: 'Explosions, voices, clicks', rot: '-5deg' },
  { id: 'music', label: 'Music', hint: 'Menu and match music', rot: '4deg' },
  { id: 'vibration', label: 'Vibration', hint: 'Feel the blasts in your palm', rot: '-3deg' },
  { id: 'motion', label: 'Motion effects', hint: 'Screen shake, zooms, slow motion', rot: '5deg' }
];
const toggles = defs.map((d) => ({
  ...d,
  on: !!on[d.id],
  state: on[d.id] ? 'ON' : 'OFF',
  bg: on[d.id] ? '#5BE36A' : '#FFFFFF',
  fg: on[d.id] ? '#111111' : '#B3151A',
  flip: () => this.setState({ on: { ...on, [d.id]: !on[d.id] } })
}));
const seg = (key, labels, def) => labels.map((label) => {
  const sel = (st[key] || def) === label;
  return { label, on: sel, bg: sel ? '#111111' : '#FFFFFF', fg: sel ? '#FFD60A' : '#111111', pick: () => this.setState({ [key]: label }) };
});
return { toggles, quality: seg('q', ['Low', 'Medium', 'High'], 'Medium'), views: seg('v', ['2D', '1P', '3P'], '2D') };
}
}
</script>
</body>
</html>
