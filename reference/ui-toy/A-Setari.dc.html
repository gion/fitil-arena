<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Settings (A)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#FFC531}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background: #2B1A78; color: #FFFFFF; font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; gap: 24px; padding: 16px 56px 22px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="A-Home.dc.html" aria-label="Back" style="width: 48px; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FF4F8B; border: 3px solid #1A1040; border-radius: 16px; box-shadow: inset 0 -5px 0 #D12863, 0 4px 0 #1A1040">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #1A1040; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 30px; letter-spacing: 1px; -webkit-text-stroke: 6px #1A1040; paint-order: stroke fill; text-shadow: 0 4px 0 #1A1040">SETTINGS</h1>
    <div style="margin-left: auto; font-weight: 700; font-size: 12px; color: #D9D2FF">version [X.Y.Z]</div>
  </div>

  <div style="flex-grow: 1; display: flex; gap: 16px; min-height: 0">
    <section style="position: relative; flex-grow: 1; box-sizing: border-box; background: #3A259A; border: 3px solid #1A1040; border-radius: 24px; box-shadow: 0 5px 0 #1A1040; padding: 18px 14px 8px; display: flex; flex-direction: column; justify-content: space-between">
      <h2 style="position: absolute; left: 14px; top: -16px; margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 15px; letter-spacing: 1px; color: #1A1040; background: #5BE36A; border: 3px solid #1A1040; border-radius: 10px; padding: 2px 12px; transform: rotate(2deg)">SOUND AND FEEL</h2>
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 52px">
          <div style="display: flex; flex-direction: column; line-height: 1.2">
            <span style="font-family: 'Lilita One', sans-serif; font-size: 17px">{{t.label}}</span>
            <span style="font-weight: 700; font-size: 12px; color: #D9D2FF">{{t.hint}}</span>
          </div>
          <button type="button" role="switch" aria-checked="{{t.on}}" aria-label="{{t.label}}" onClick="{{t.flip}}" style="margin-left: auto; flex-shrink: 0; width: 72px; height: 44px; box-sizing: border-box; padding: 3px; display: flex; align-items: center; justify-content: {{t.justify}}; background: {{t.bg}}; border: 3px solid #1A1040; border-radius: 22px; box-shadow: inset 0 4px 0 rgba(26,16,64,0.25); cursor: pointer">
            <span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 3px solid #1A1040; box-shadow: inset 0 -4px 0 #D5D0EA"></span>
          </button>
        </div>
      </sc-for>
    </section>

    <section style="position: relative; width: 290px; flex-shrink: 0; box-sizing: border-box; background: #3A259A; border: 3px solid #1A1040; border-radius: 24px; box-shadow: 0 5px 0 #1A1040; padding: 22px 14px 12px; display: flex; flex-direction: column; gap: 6px">
      <h2 style="position: absolute; left: 14px; top: -16px; margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 15px; letter-spacing: 1px; color: #1A1040; background: #2FD4FF; border: 3px solid #1A1040; border-radius: 10px; padding: 2px 12px; transform: rotate(-3deg)">PICTURE</h2>
      <div style="font-weight: 900; font-size: 14px">3D graphics quality</div>
      <div role="group" aria-label="3D graphics quality" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #1F1259; border: 3px solid #1A1040; border-radius: 16px; padding: 3px; gap: 3px">
        <sc-for list="{{quality}}" as="q" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{q.on}}" onClick="{{q.pick}}" style="height: 44px; padding: 0; font-family: 'Lilita One', sans-serif; font-size: 15px; color: {{q.fg}}; background: {{q.bg}}; border: 0; border-radius: 11px; cursor: pointer">{{q.label}}</button>
        </sc-for>
      </div>
      <div style="font-weight: 900; font-size: 14px; margin-top: 8px">View</div>
      <div role="group" aria-label="Default view" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #1F1259; border: 3px solid #1A1040; border-radius: 16px; padding: 3px; gap: 3px">
        <sc-for list="{{views}}" as="q" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{q.on}}" onClick="{{q.pick}}" style="height: 44px; padding: 0; font-family: 'Lilita One', sans-serif; font-size: 15px; color: {{q.fg}}; background: {{q.bg}}; border: 0; border-radius: 11px; cursor: pointer">{{q.label}}</button>
        </sc-for>
      </div>
      <div style="margin-top: auto; font-weight: 700; font-size: 12px; line-height: 1.3; color: #D9D2FF">Your progress is saved on this phone.</div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const on = { sound: true, music: true, vibration: true, motion: true, ...(st.on || {}) };
const defs = [
  { id: 'sound', label: 'Sound', hint: 'Explosions, voices, clicks' },
  { id: 'music', label: 'Music', hint: 'Menu and match music' },
  { id: 'vibration', label: 'Vibration', hint: 'Feel the blasts in your palm' },
  { id: 'motion', label: 'Motion effects', hint: 'Screen shake, zooms, slow motion' }
];
const toggles = defs.map((d) => ({
  ...d,
  on: !!on[d.id],
  bg: on[d.id] ? '#5BE36A' : '#6B58C9',
  justify: on[d.id] ? 'flex-end' : 'flex-start',
  flip: () => this.setState({ on: { ...on, [d.id]: !on[d.id] } })
}));
const seg = (key, labels, def) => labels.map((label) => {
  const sel = (st[key] || def) === label;
  return { label, on: sel, bg: sel ? '#FFC531' : 'transparent', fg: sel ? '#1A1040' : '#FFFFFF', pick: () => this.setState({ [key]: label }) };
});
return { toggles, quality: seg('q', ['Low', 'Medium', 'High'], 'Medium'), views: seg('v', ['2D', '1P', '3P'], '2D') };
}
}
</script>
</body>
</html>
