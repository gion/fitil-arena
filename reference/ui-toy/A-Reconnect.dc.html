<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Connection lost (A)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#FFC531}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #679D48; background-image: linear-gradient(45deg, rgba(0,0,0,0.1) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.1) 75%), linear-gradient(45deg, rgba(0,0,0,0.1) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.1) 75%); background-size: 96px 96px; background-position: 0 0, 48px 48px; color: #FFFFFF; font-family: 'Nunito', sans-serif; display: flex; align-items: center; justify-content: center">
  <div style="position: absolute; inset: 0; background: rgba(26,16,64,0.8)"></div>

  <div style="position: relative; width: 580px; box-sizing: border-box; background: #3A259A; border: 3px solid #1A1040; border-radius: 30px; box-shadow: 0 8px 0 #1A1040; padding: 34px 20px 18px; display: flex; gap: 18px">
    <h1 style="position: absolute; left: 50%; top: -28px; margin: 0; white-space: nowrap; transform: translateX(-50%) rotate(-3deg); font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 28px; letter-spacing: 2px; color: #1A1040; background: #FF8FB6; border: 3px solid #1A1040; border-radius: 16px; padding: 2px 24px 6px; box-shadow: inset 0 -6px 0 #E85C8E, 0 5px 0 #1A1040">{{title}}</h1>
    <div style="width: 150px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; background: #1F1259; border: 3px solid #1A1040; border-radius: 22px; padding-top: 8px">
      <div style="background: #FFFFFF; color: #1A1040; border: 3px solid #1A1040; border-radius: 14px 14px 14px 4px; padding: 3px 10px; font-weight: 900; font-size: 13px">Hello? Anyone?</div>
      <svg viewBox="0 -8 100 118" style="width: 112px; height: 132px" aria-hidden="true">
        <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
        <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
        <circle cx="72" cy="4" r="6" style="fill: #5AD15A; stroke: #12131C; stroke-width: 3"/>
        <circle cx="50" cy="58" r="38" style="fill: #5AD15A; stroke: #12131C; stroke-width: 5"/>
        <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
        <circle cx="36" cy="56" r="4" style="fill: #12131C"/><circle cx="64" cy="56" r="4" style="fill: #12131C"/>
        <path d="M26 44 l14 -5M74 44 l-14 -5" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
        <path d="M42 78 q8 -7 16 0" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
        <ellipse cx="82" cy="50" rx="4" ry="6" style="fill: #8FD3FF; stroke: #12131C; stroke-width: 2"/>
      </svg>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px">
      <div style="font-weight: 700; font-size: 14px; line-height: 1.35">{{body}}</div>
      <sc-if value="{{isTrying}}" hint-placeholder-val="{{true}}">
        <div>
          <div style="display: flex; justify-content: space-between; font-weight: 900; font-size: 13px; margin-bottom: 4px"><span>Reconnecting…</span><span>12s left</span></div>
          <div style="height: 20px; box-sizing: border-box; background: #1F1259; border: 3px solid #1A1040; border-radius: 10px; overflow: hidden">
            <div style="width: 80%; height: 100%; background: #FFC531; box-shadow: inset 0 -5px 0 #E09A00"></div>
          </div>
        </div>
      </sc-if>
      <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding-bottom: 5px">
        <button type="button" onClick="{{toggle}}" style="height: 58px; font-family: 'Lilita One', sans-serif; font-size: 20px; color: #1A1040; background: #FFC531; border: 3px solid #1A1040; border-radius: 20px; box-shadow: inset 0 -7px 0 #E09A00, 0 5px 0 #1A1040; cursor: pointer">{{primary}}</button>
        <a href="A-Home.dc.html" style="height: 58px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Lilita One', sans-serif; font-size: 18px; color: #1A1040; background: #FFFFFF; border: 3px solid #1A1040; border-radius: 20px; box-shadow: inset 0 -7px 0 #D5D0EA, 0 5px 0 #1A1040">Leave match</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["reconnecting","failed"],"default":"reconnecting"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const base = this.props.state ?? 'reconnecting';
const flipped = !!(this.state && this.state.flipped);
const trying = (base === 'reconnecting') !== flipped;
return {
  isTrying: trying,
  title: trying ? 'CONNECTION LOST' : 'NO WAY BACK',
  body: trying
    ? 'The match keeps going without you. Your character stands still until you are back.'
    : 'We could not get you back in time. A bot took your seat for the rest of the match.',
  primary: trying ? 'Try now' : 'Try again',
  toggle: () => this.setState({ flipped: !flipped })
};
}
}
</script>
</body>
</html>
