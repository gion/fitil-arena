<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Feedback and motion (A)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#FFC531}a:hover{color:#FFE08A}
@keyframes nz-spin{to{transform:rotate(360deg)}}
@keyframes nz-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes nz-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
@keyframes nz-wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@keyframes nz-pulse{0%,80%,100%{transform:scale(1)}90%{transform:scale(1.2)}}
@keyframes nz-shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes nz-pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background: #2B1A78; color: #FFFFFF; font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 16px 56px 20px">
  <div style="display: flex; align-items: center; gap: 14px">
    <h1 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 30px; letter-spacing: 1px; -webkit-text-stroke: 6px #1A1040; paint-order: stroke fill; text-shadow: 0 4px 0 #1A1040">FEEL LAB</h1>
    <div style="font-weight: 800; font-size: 13px; color: #D9D2FF">Press things. Watch the character and the readout.</div>
  </div>

  <div style="flex-grow: 1; display: flex; gap: 18px; min-height: 0">
    <div style="position: relative; width: 220px; flex-shrink: 0; overflow: hidden; background: #3A259A; border: 3px solid #1A1040; border-radius: 26px; box-shadow: 0 6px 0 #1A1040; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 6px">
      <div style="position: absolute; left: -150px; top: -150px; width: 520px; height: 520px; border-radius: 50%; background: repeating-conic-gradient(#4A33B8 0deg 15deg, #3A259A 15deg 30deg); animation: nz-spin 90s linear infinite"></div>
      <div style="position: absolute; left: 10px; right: 10px; top: 10px; background: #FFFFFF; color: #1A1040; border: 3px solid #1A1040; border-radius: 16px 16px 16px 4px; padding: 5px 10px; font-weight: 900; font-size: 14px; line-height: 1.2; text-align: center; box-shadow: 0 3px 0 #1A1040">{{say}}</div>
      <div style="position: relative; animation: nz-bob 1.600s ease-in-out infinite">
        <svg viewBox="0 -8 100 118" style="display: block; width: 146px; height: 172px" aria-hidden="true">
          <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
          <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
          <circle cx="72" cy="4" r="6" style="fill: #5AD15A; stroke: #12131C; stroke-width: 3"/>
          <circle cx="50" cy="58" r="38" style="fill: #5AD15A; stroke: #12131C; stroke-width: 5"/>
          <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
            <g style="transform-origin: 50px 53px; animation: nz-blink 4s infinite">
              <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
              <circle cx="38" cy="55" r="4" style="fill: #12131C"/><circle cx="66" cy="55" r="4" style="fill: #12131C"/>
            </g>
          </sc-if>
          <sc-if value="{{isHappy}}" hint-placeholder-val="{{false}}">
            <path d="M28 56 q8 -11 16 0M56 56 q8 -11 16 0" style="fill: none; stroke: #12131C; stroke-width: 4.500; stroke-linecap: round"/>
            <path d="M40 68 a10 10 0 0 0 20 0z" style="fill: #12131C"/>
            <path d="M45 74 a5 4 0 0 0 10 0z" style="fill: #FF6B8A"/>
          </sc-if>
          <sc-if value="{{isFierce}}" hint-placeholder-val="{{false}}">
            <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
            <circle cx="38" cy="55" r="4" style="fill: #12131C"/><circle cx="66" cy="55" r="4" style="fill: #12131C"/>
            <path d="M25 40 l16 5M75 40 l-16 5" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
            <path d="M42 74 h16" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
          </sc-if>
          <sc-if value="{{isSad}}" hint-placeholder-val="{{false}}">
            <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
            <circle cx="36" cy="57" r="4" style="fill: #12131C"/><circle cx="64" cy="57" r="4" style="fill: #12131C"/>
            <path d="M26 44 l14 -5M74 44 l-14 -5" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
            <path d="M42 78 q8 -7 16 0" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
            <ellipse cx="82" cy="50" rx="4" ry="6" style="fill: #8FD3FF; stroke: #12131C; stroke-width: 2"/>
          </sc-if>
        </svg>
      </div>
    </div>

    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
        <button type="button" onPointerDown="{{play.down}}" onPointerUp="{{play.up}}" onPointerLeave="{{play.leave}}" style="height: 72px; padding: 0 0 6px; font-family: 'Lilita One', sans-serif; font-size: 34px; letter-spacing: 1px; color: #1A1040; background: #FFC531; border: 3px solid #1A1040; border-radius: 22px; box-shadow: {{play.shadow}}; transform: {{play.transform}}; transition: transform 0.080s ease-out, box-shadow 0.080s ease-out; cursor: pointer">PLAY</button>
        <button type="button" onPointerDown="{{shop.down}}" onPointerUp="{{shop.up}}" onPointerLeave="{{shop.leave}}" style="height: 72px; padding: 0 0 6px; font-family: 'Lilita One', sans-serif; font-size: 22px; color: #1A1040; background: #FFFFFF; border: 3px solid #1A1040; border-radius: 22px; box-shadow: {{shop.shadow}}; transform: {{shop.transform}}; transition: transform 0.080s ease-out, box-shadow 0.080s ease-out; cursor: pointer">Shop</button>
        <button type="button" onClick="{{buy}}" style="position: relative; height: 72px; padding: 0 0 6px; font-family: 'Lilita One', sans-serif; font-size: 17px; color: #1A1040; background: #5BE36A; border: 3px solid #1A1040; border-radius: 22px; box-shadow: inset 0 -7px 0 #2FB843, 0 5px 0 #1A1040; cursor: pointer">Buy · 40 Fitile
          <sc-if value="{{bought}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; right: -10px; top: -12px; height: 26px; box-sizing: border-box; border-radius: 13px; background: #D81E45; color: #FFFFFF; border: 3px solid #1A1040; font-size: 13px; line-height: 20px; padding: 0 8px; animation: nz-pop 0.260s ease-out both">YOURS!</span>
          </sc-if>
        </button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
        <div style="height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: #3A259A; border: 3px solid #1A1040; border-radius: 20px">
          <span style="font-family: 'Lilita One', sans-serif; font-size: 18px">Sound</span>
          <button type="button" role="switch" aria-checked="{{soundOn}}" aria-label="Sound" onClick="{{flip}}" style="width: 72px; height: 44px; box-sizing: border-box; padding: 3px; display: flex; align-items: center; background: {{swBg}}; border: 3px solid #1A1040; border-radius: 22px; box-shadow: inset 0 4px 0 rgba(26,16,64,0.25); cursor: pointer; transition: background 0.120s">
            <span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 3px solid #1A1040; box-shadow: inset 0 -4px 0 #D5D0EA; transform: {{knob}}; transition: transform 0.160s cubic-bezier(0.3, 1.6, 0.6, 1)"></span>
          </button>
        </div>
        <button type="button" onClick="{{locked}}" style="height: 64px; padding: 0; background: transparent; border: 0; cursor: pointer">
          <sc-if value="{{shaking}}" hint-placeholder-val="{{false}}">
            <span style="height: 64px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; font-family: 'Lilita One', sans-serif; font-size: 18px; color: #FFFFFF; background: #1F1259; border: 3px dashed #6B58C9; border-radius: 20px; animation: nz-shake 0.240s linear both">Crown<span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 12px; color: #FFB3C7">Player Lv 6</span></span>
          </sc-if>
          <sc-if value="{{still}}" hint-placeholder-val="{{true}}">
            <span style="height: 64px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; font-family: 'Lilita One', sans-serif; font-size: 18px; color: #FFFFFF; background: #1F1259; border: 3px dashed #6B58C9; border-radius: 20px; opacity: 0.7">Crown<span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 12px; color: #FFB3C7">Player Lv 6</span></span>
          </sc-if>
        </button>
        <div style="height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 14px; border: 3px dashed #6B58C9; border-radius: 20px">
          <span style="font-family: 'Lilita One', sans-serif; font-size: 46px; line-height: 1; color: #6B58C9; -webkit-text-stroke: 5px #1A1040; paint-order: stroke fill; animation: nz-wobble 1.200s ease-in-out infinite">?</span>
          <span style="height: 24px; box-sizing: border-box; border-radius: 12px; background: #D81E45; color: #FFFFFF; border: 3px solid #1A1040; font-family: 'Lilita One', sans-serif; font-size: 12px; line-height: 18px; padding: 0 6px; animation: nz-pulse 3s ease-in-out infinite">NEW</span>
        </div>
      </div>
      <div style="margin-top: auto; margin-bottom: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #1F1259; border: 3px solid #1A1040; border-radius: 18px; overflow: hidden">
        <div style="padding: 6px 12px; border-right: 3px solid #1A1040; line-height: 1.25"><div style="font-weight: 900; font-size: 11px; letter-spacing: 1px; color: #D9D2FF">LAST ACTION</div><div style="font-family: 'Lilita One', sans-serif; font-size: 17px">{{log.action}}</div></div>
        <div style="padding: 6px 12px; border-right: 3px solid #1A1040; line-height: 1.25"><div style="font-weight: 900; font-size: 11px; letter-spacing: 1px; color: #D9D2FF">SOUND</div><div style="font-family: 'Lilita One', sans-serif; font-size: 17px">{{log.sound}}</div></div>
        <div style="padding: 6px 12px; line-height: 1.25"><div style="font-weight: 900; font-size: 11px; letter-spacing: 1px; color: #D9D2FF">HAPTIC</div><div style="font-family: 'Lilita One', sans-serif; font-size: 17px">{{log.haptic}}</div></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const face = st.face || 'idle';
const react = (f, say, log, ms) => {
  clearTimeout(this._t);
  this.setState({ face: f, say, log });
  this._t = setTimeout(() => this.setState({ face: 'idle', say: null }), ms || 1100);
};
const press = (key, lip, hi, say, face, log) => {
  const down = st.down === key;
  return {
    shadow: down ? 'inset 0 -2px 0 ' + lip + ', inset 0 4px 0 ' + hi + ', 0 0 0 #1A1040' : 'inset 0 -8px 0 ' + lip + ', inset 0 4px 0 ' + hi + ', 0 5px 0 #1A1040',
    transform: down ? 'translateY(5px)' : 'translateY(0)',
    down: () => this.setState({ down: key }),
    leave: () => { if (down) this.setState({ down: null }); },
    up: () => { this.setState({ down: null }); react(face, say, log); }
  };
};
const soundOn = st.sound !== false;
return {
  isIdle: face === 'idle', isHappy: face === 'happy', isFierce: face === 'fierce', isSad: face === 'sad',
  say: st.say || 'Go on, press something.',
  log: st.log || { action: 'Nothing yet', sound: '—', haptic: '—' },
  play: press('play', '#E09A00', '#FFE08A', 'Let’s blow stuff up!', 'fierce', { action: 'Main button', sound: 'Pop, low', haptic: 'Light · 12 ms' }),
  shop: press('shop', '#D5D0EA', '#FFFFFF', 'Ooh, shopping.', 'happy', { action: 'Secondary button', sound: 'Tick', haptic: 'Light · 8 ms' }),
  bought: !!st.bought,
  buy: () => { this.setState({ bought: true }); react('happy', 'Mine! All mine!', { action: 'Purchase', sound: 'Tada', haptic: 'Medium · 30 ms' }, 1400); },
  soundOn,
  swBg: soundOn ? '#5BE36A' : '#6B58C9',
  knob: soundOn ? 'translateX(28px)' : 'translateX(0)',
  flip: () => { this.setState({ sound: !soundOn }); react(soundOn ? 'sad' : 'happy', soundOn ? 'Fine. I’ll whisper.' : 'CAN YOU HEAR ME?', { action: soundOn ? 'Switch off' : 'Switch on', sound: soundOn ? 'Click, lower' : 'Click', haptic: 'Light · 15 ms' }); },
  shaking: !!st.shake, still: !st.shake,
  locked: () => { this.setState({ shake: true }); setTimeout(() => this.setState({ shake: false }), 260); react('sad', 'Not yet. Level 6.', { action: 'Locked item', sound: 'Nope buzz', haptic: '20 · 40 · 20 ms' }); }
};
}
}
</script>
</body>
</html>
