<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Character page (A)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#FFC531}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background: #2B1A78; color: #FFFFFF; font-family: 'Nunito', sans-serif; display: flex; gap: 20px; padding: 16px 56px 22px">
  <div style="width: 240px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px">
    <div style="position: relative; flex-grow: 1; overflow: hidden; background: #3A259A; border: 3px solid #1A1040; border-radius: 26px; box-shadow: 0 6px 0 #1A1040; display: flex; align-items: flex-end; justify-content: center">
      <div style="position: absolute; left: -140px; top: -150px; width: 520px; height: 520px; border-radius: 50%; background: repeating-conic-gradient(#4A33B8 0deg 15deg, #3A259A 15deg 30deg)"></div>
      <div style="position: absolute; left: 10px; right: 10px; top: 10px; background: #FFFFFF; color: #1A1040; border: 3px solid #1A1040; border-radius: 16px 16px 16px 4px; padding: 5px 10px; font-weight: 900; font-size: 13px; line-height: 1.2; text-align: center; box-shadow: 0 3px 0 #1A1040">{{c.tagline}}</div>
      <svg viewBox="0 -8 100 118" style="position: relative; width: 140px; height: 165px; margin-bottom: 6px" aria-hidden="true">
        <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
        <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
        <circle cx="72" cy="4" r="6" fill="{{c.color}}" style="stroke: #12131C; stroke-width: 3"/>
        <circle cx="50" cy="58" r="38" fill="{{c.color}}" style="stroke: #12131C; stroke-width: 5"/>
        <path d="M28 56 q8 -11 16 0M56 56 q8 -11 16 0" style="fill: none; stroke: #12131C; stroke-width: 4.500; stroke-linecap: round"/>
        <path d="M40 68 a10 10 0 0 0 20 0z" style="fill: #12131C"/>
      </svg>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-bottom: 5px">
      <button type="button" style="height: 50px; font-family: 'Lilita One', sans-serif; font-size: 18px; color: #1A1040; background: #FFFFFF; border: 3px solid #1A1040; border-radius: 18px; box-shadow: inset 0 -6px 0 #D5D0EA, 0 5px 0 #1A1040; cursor: pointer">Listen</button>
      <a href="A-Game.dc.html" style="height: 50px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Lilita One', sans-serif; font-size: 18px; color: #1A1040; background: #2FD4FF; border: 3px solid #1A1040; border-radius: 18px; box-shadow: inset 0 -6px 0 #12A9D6, 0 5px 0 #1A1040">Try</a>
    </div>
  </div>

  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="A-Personaje.dc.html" aria-label="Back" style="width: 48px; height: 48px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FF4F8B; border: 3px solid #1A1040; border-radius: 16px; box-shadow: inset 0 -5px 0 #D12863, 0 4px 0 #1A1040">
        <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #1A1040; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 1px; -webkit-text-stroke: 6px #1A1040; paint-order: stroke fill; text-shadow: 0 4px 0 #1A1040">{{c.name}}</h1>
      <span style="font-family: 'Lilita One', sans-serif; font-size: 13px; letter-spacing: 1px; color: #1A1040; border: 3px solid #1A1040; border-radius: 10px; padding: 1px 10px; background: {{c.rarityColor}}">{{c.rarity}}</span>
    </div>
    <div style="background: #1F1259; border: 3px solid #1A1040; border-radius: 16px; padding: 6px 12px; font-weight: 700; font-size: 14px; line-height: 1.3"><span style="font-family: 'Lilita One', sans-serif; color: #FFC531">Ultimate · {{c.ult}}:</span> {{c.ultDesc}}</div>
    <div>
      <div style="display: flex; justify-content: space-between; font-weight: 900; font-size: 13px; margin-bottom: 4px"><span>{{c.levelLine}}</span><span>{{c.xpLine}}</span></div>
      <div style="height: 18px; box-sizing: border-box; background: #1F1259; border: 3px solid #1A1040; border-radius: 9px; overflow: hidden"><div style="height: 100%; background: #5BE36A; box-shadow: inset 0 -4px 0 #2FB843; width: {{c.xpPct}}"></div></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{rewards}}" as="r" hint-placeholder-count="5">
        <div style="height: 62px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.15; color: {{r.fg}}; background: {{r.bg}}; border: 3px {{r.border}} {{r.line}}; border-radius: 14px; padding: 0 4px">
          <span style="font-family: 'Lilita One', sans-serif; font-size: 14px">{{r.level}}</span>
          <span style="font-weight: 800; font-size: 11.500px">{{r.what}}</span>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 14px; padding-bottom: 5px">
      <div style="flex-grow: 1; font-weight: 700; font-size: 13px; line-height: 1.3; color: #E4DEFF">{{c.note}}</div>
      <button type="button" onClick="{{toggle}}" style="flex-shrink: 0; min-width: 230px; height: 62px; padding: 0 16px; font-family: 'Lilita One', sans-serif; font-size: 20px; letter-spacing: 1px; color: #1A1040; background: {{c.ctaBg}}; border: 3px solid #1A1040; border-radius: 22px; box-shadow: inset 0 -8px 0 {{c.ctaLip}}, 0 5px 0 #1A1040; cursor: pointer">{{c.cta}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"character":{"editor":"enum","options":["owned","for sale"],"default":"owned"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const base = (this.props.character ?? 'owned') === 'owned';
const flipped = !!(this.state && this.state.flipped);
const owned = base !== flipped;
const c = owned
  ? { name: 'BUBU', rarity: 'Common', rarityColor: '#9AA3C0', color: '#5AD15A', tagline: 'Round, cheerful, starts with a bang.', ult: 'Big Bang', ultDesc: 'Drops a giant bomb (+2 range) on top of your normal ones.', levelLine: 'Level 3', xpLine: '140/300 XP', xpPct: '47%', note: 'Selected. XP comes from matches, doubled for the first one each day.', cta: 'SELECTED', ctaBg: '#FFFFFF', ctaLip: '#D5D0EA' }
  : { name: 'FIFI', rarity: 'Epic', rarityColor: '#B169FF', color: '#FF9AD0', tagline: 'Graceful, and grabs everything.', ult: 'Cluster', ultDesc: 'Four mini-bombs in a cross, two tiles away.', levelLine: 'Level 1', xpLine: '0/100 XP', xpPct: '0%', note: 'You have 850 Fitile. Everything you unlock stays yours.', cta: 'BUY FOR 600 FITILE', ctaBg: '#FFC531', ctaLip: '#E09A00' };
const got = owned ? 3 : 1;
const rewards = [['Lv 2', '+50 Fitile'], ['Lv 3', 'Cap'], ['Lv 4', '+80 Fitile'], ['Lv 5', 'title “Boom Baby”'], ['Lv 6', 'Party hat']].map((r, i) => {
  const done = i + 2 <= got;
  return { level: r[0], what: r[1], bg: done ? '#5BE36A' : '#1F1259', fg: done ? '#1A1040' : '#FFFFFF', border: done ? 'solid' : 'dashed', line: done ? '#1A1040' : '#6B58C9' };
});
return { c, rewards, toggle: () => this.setState({ flipped: !flipped }) };
}
}
</script>
</body>
</html>
