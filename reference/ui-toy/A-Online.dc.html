<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Online (A)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#FFC531}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background: #2B1A78; color: #FFFFFF; font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; gap: 22px; padding: 16px 56px 22px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="A-Home.dc.html" aria-label="Back" style="width: 48px; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FF4F8B; border: 3px solid #1A1040; border-radius: 16px; box-shadow: inset 0 -5px 0 #D12863, 0 4px 0 #1A1040">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #1A1040; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 30px; letter-spacing: 1px; -webkit-text-stroke: 6px #1A1040; paint-order: stroke fill; text-shadow: 0 4px 0 #1A1040">ONLINE</h1>
    <label style="margin-left: auto; display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 13px">Your name
      <input type="text" value="Gion" maxlength="12" style="width: 150px; height: 46px; box-sizing: border-box; padding: 0 12px; font-family: 'Lilita One', sans-serif; font-size: 18px; color: #1A1040; background: #FFFFFF; border: 3px solid #1A1040; border-radius: 16px">
    </label>
    <a href="A-Personaje.dc.html" style="display: flex; align-items: center; gap: 8px; height: 46px; box-sizing: border-box; padding: 0 14px 0 6px; text-decoration: none; font-family: 'Lilita One', sans-serif; font-size: 16px; color: #FFFFFF; background: #1F1259; border: 3px solid #1A1040; border-radius: 23px">
      <span style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; background: #5AD15A; border: 3px solid #12131C"></span>Bubu
    </a>
  </div>

  <div style="flex-grow: 1; display: flex; gap: 18px; min-height: 0">
    <section style="position: relative; flex-grow: 1; box-sizing: border-box; background: #3A259A; border: 3px solid #1A1040; border-radius: 24px; box-shadow: 0 5px 0 #1A1040; padding: 22px 14px 14px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="position: absolute; left: 14px; top: -16px; margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 15px; letter-spacing: 1px; color: #1A1040; background: #2FD4FF; border: 3px solid #1A1040; border-radius: 10px; padding: 2px 12px; transform: rotate(-3deg)">QUICK PLAY</h2>
      <div style="font-weight: 800; font-size: 13px; color: #E4DEFF">Jump into a public match. Bots fill the empty seats.</div>
      <div role="group" aria-label="Quick play mode" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="6">
          <button type="button" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="height: 44px; padding: 0 4px; font-family: 'Lilita One', sans-serif; font-size: 14px; color: {{m.fg}}; background: {{m.bg}}; border: 3px solid #1A1040; border-radius: 14px; cursor: pointer">{{m.label}}</button>
        </sc-for>
      </div>
      <a href="A-Matchmaking.dc.html" style="margin-top: auto; height: 68px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Lilita One', sans-serif; font-size: 28px; letter-spacing: 1px; color: #1A1040; background: #FFC531; border: 3px solid #1A1040; border-radius: 22px; box-shadow: inset 0 -8px 0 #E09A00, inset 0 4px 0 #FFE08A, 0 5px 0 #1A1040">QUICK PLAY</a>
    </section>

    <section style="position: relative; width: 300px; flex-shrink: 0; box-sizing: border-box; background: #3A259A; border: 3px solid #1A1040; border-radius: 24px; box-shadow: 0 5px 0 #1A1040; padding: 22px 14px 14px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="position: absolute; left: 14px; top: -16px; margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 15px; letter-spacing: 1px; color: #1A1040; background: #FFC531; border: 3px solid #1A1040; border-radius: 10px; padding: 2px 12px; transform: rotate(2deg)">PRIVATE ROOM</h2>
      <a href="A-Lobby.dc.html" style="height: 58px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Lilita One', sans-serif; font-size: 20px; color: #1A1040; background: #2FD4FF; border: 3px solid #1A1040; border-radius: 18px; box-shadow: inset 0 -6px 0 #12A9D6, 0 5px 0 #1A1040">Create a room</a>
      <div style="text-align: center; font-weight: 900; font-size: 12px; letter-spacing: 1px; color: #D9D2FF">OR JOIN WITH A CODE</div>
      <div style="margin-top: auto; display: flex; gap: 10px">
        <input type="text" aria-label="Room code" placeholder="CODE" maxlength="4" style="flex-grow: 1; min-width: 0; height: 58px; box-sizing: border-box; text-align: center; font-family: 'Lilita One', sans-serif; font-size: 28px; letter-spacing: 8px; color: #1A1040; background: #FFFFFF; border: 3px solid #1A1040; border-radius: 18px; box-shadow: inset 0 5px 0 #D5D0EA">
        <a href="A-Lobby.dc.html" style="width: 96px; height: 58px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Lilita One', sans-serif; font-size: 20px; color: #1A1040; background: #5BE36A; border: 3px solid #1A1040; border-radius: 18px; box-shadow: inset 0 -6px 0 #2FB843, 0 5px 0 #1A1040">Join</a>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.mode) || 'Free for all';
const modes = ['Free for all', '1 vs 1', 'Teams 2v2', 'Teams 3v3', 'Capture the flag', 'Crown'].map((label) => ({
  label,
  on: label === picked,
  bg: label === picked ? '#FFC531' : '#1F1259',
  fg: label === picked ? '#1A1040' : '#FFFFFF',
  pick: () => this.setState({ mode: label })
}));
return { modes };
}
}
</script>
</body>
</html>
