<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitil — Rankings (A)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#FFC531}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background: #2B1A78; color: #FFFFFF; font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 16px 56px 20px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="A-Home.dc.html" aria-label="Back" style="width: 48px; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FF4F8B; border: 3px solid #1A1040; border-radius: 16px; box-shadow: inset 0 -5px 0 #D12863, 0 4px 0 #1A1040">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: #1A1040; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 30px; letter-spacing: 1px; -webkit-text-stroke: 6px #1A1040; paint-order: stroke fill; text-shadow: 0 4px 0 #1A1040">RANKINGS</h1>
    <div role="group" aria-label="Ranking type" style="margin-left: auto; display: flex; background: #1F1259; border: 3px solid #1A1040; border-radius: 18px; padding: 3px; gap: 3px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="height: 44px; padding: 0 16px; font-family: 'Lilita One', sans-serif; font-size: 15px; color: {{t.fg}}; background: {{t.bg}}; border: 0; border-radius: 13px; cursor: pointer">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; gap: 18px; min-height: 0">
    <div style="width: 204px; flex-shrink: 0; box-sizing: border-box; background: #2FD4FF; color: #1A1040; border: 3px solid #1A1040; border-radius: 24px; box-shadow: inset 0 -8px 0 #12A9D6, 0 5px 0 #1A1040; padding: 10px 12px 16px; display: flex; flex-direction: column; align-items: center">
      <div style="font-family: 'Lilita One', sans-serif; font-size: 13px; letter-spacing: 1px">YOUR RANK</div>
      <div style="font-family: 'Lilita One', sans-serif; font-size: 52px; line-height: 1">{{me.rank}}</div>
      <svg viewBox="0 -8 100 118" style="width: 84px; height: 99px" aria-hidden="true">
        <ellipse cx="36" cy="100" rx="11" ry="6" style="fill: #12131C"/><ellipse cx="64" cy="100" rx="11" ry="6" style="fill: #12131C"/>
        <path d="M50 20 Q60 -4 72 3" style="fill: none; stroke: #12131C; stroke-width: 4; stroke-linecap: round"/>
        <circle cx="72" cy="4" r="6" style="fill: #FFD23F; stroke: #12131C; stroke-width: 3"/>
        <circle cx="50" cy="58" r="38" style="fill: #FFD23F; stroke: #12131C; stroke-width: 5"/>
        <ellipse cx="36" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/><ellipse cx="64" cy="53" rx="8" ry="10" style="fill: #FFFFFF"/>
        <circle cx="38" cy="55" r="4" style="fill: #12131C"/><circle cx="66" cy="55" r="4" style="fill: #12131C"/>
      </svg>
      <div style="font-family: 'Lilita One', sans-serif; font-size: 20px; line-height: 1.1">Gion</div>
      <div style="font-weight: 900; font-size: 14px">{{me.score}}</div>
      <div style="margin-top: auto; font-weight: 800; font-size: 12px; text-align: center; line-height: 1.25">{{me.gap}}</div>
    </div>

    <ol style="flex-grow: 1; margin: 0; padding: 0 4px 6px 0; list-style: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <li style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; height: 46px; box-sizing: border-box; padding: 0 14px 0 6px; background: {{r.bg}}; border: 3px solid {{r.border}}; border-radius: 16px">
          <span style="width: 44px; height: 30px; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 16px; color: #1A1040; background: {{r.medal}}; border: 3px solid #1A1040; border-radius: 10px; box-sizing: border-box">{{r.rank}}</span>
          <span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; background: {{r.color}}; border: 3px solid #12131C"></span>
          <span style="font-family: 'Lilita One', sans-serif; font-size: 17px">{{r.name}}</span>
          <span style="margin-left: auto; font-family: 'Lilita One', sans-serif; font-size: 17px; color: #FFC531">{{r.score}}</span>
        </li>
      </sc-for>
    </ol>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const tab = (this.state && this.state.tab) || 'global';
const cols = ['#FF5F93', '#4FC3FF', '#7DFFB0', '#FF8A3D', '#FFFFFF', '#FFD23F', '#C79BFF'];
const sets = {
  global: { me: { rank: '128', score: '1,240 trophies', gap: '35 more trophies to reach #127' }, list: [['1', 'BoomBoom_King', '9,812'], ['2', 'TantiVetaFan', '9,640'], ['3', 'Sparky', '9,105'], ['4', 'NoBrakes', '8,870'], ['5', 'Mamaliga', '8,866'], ['6', 'PuffPuff', '8,512'], ['7', 'Hot Potato', '8,430']] },
  friends: { me: { rank: '2', score: '1,240 trophies', gap: 'Mara is 170 trophies ahead' }, list: [['1', 'Mara', '1,410'], ['2', 'Gion (you)', '1,240'], ['3', 'Vlad', '980'], ['4', 'Ioana', '715'], ['5', 'Tudor', '402']] },
  daily: { me: { rank: '41', score: '1:58 today', gap: 'The daily map changes at midnight' }, list: [['1', 'Sparky', '0:47'], ['2', 'PuffPuff', '0:52'], ['3', 'NoBrakes', '0:55'], ['4', 'Mamaliga', '1:01'], ['5', 'Mara', '1:03'], ['6', 'BoomBoom_King', '1:04']] }
};
const s = sets[tab];
const medals = { '1': '#FFC531', '2': '#C9C1F2', '3': '#FFB27A' };
const rows = s.list.map((r, i) => {
  const mine = r[1].indexOf('(you)') > -1;
  return { rank: r[0], name: r[1], score: r[2], color: cols[i % cols.length], medal: medals[r[0]] || '#FFFFFF', bg: mine ? '#4A33B8' : '#1F1259', border: mine ? '#FFC531' : '#1A1040' };
});
const tabs = [['global', 'Global'], ['friends', 'Friends'], ['daily', 'Daily challenge']].map((t) => ({
  label: t[1],
  on: t[0] === tab,
  bg: t[0] === tab ? '#FFC531' : 'transparent',
  fg: t[0] === tab ? '#1A1040' : '#FFFFFF',
  pick: () => this.setState({ tab: t[0] })
}));
return { tabs, rows, me: s.me };
}
}
</script>
</body>
</html>
